// ============================================================================
// v16 (2026-11-12): Memory scanner wave 1 — ScanService
// ----------------------------------------------------------------------------
// On-target typed-value scanner with snapshot + next_scan + disk spill.
// See an internal plan for the full shape.
//
// The orchestrator assigns `scan_id` (global monotonic counter, `v####` for
// value scans) and passes it in; the agent never generates ids. One
// `_SCANS[scan_id]` map on the agent, shared between kernel-agent and
// umagent runtimes (each process keeps its own map — scans do not cross
// views). Create / Refine are async on the agent for large snapshots
// (orchestrator polls Status). Fetch streams rows in chunks.
//
// Scan files live under `<agent_dir>\scans\<view>\<scan_id>\` (overridable
// via targets.json scan.dir). Agent-owned state; the driver is untouched.
// ============================================================================

// A contiguous VA range handed to Create. The orchestrator resolves
// sections / region filters into a flat list of these.
message ScanSpan {
  uint64 va = 1;
  uint64 size = 2;
}

// Wire-friendly value-type tag. String matches the orchestrator's
// `value_type=` kwarg verbatim ("int32", "uint64", "float", "double",
// "string", "utf16", ...). Width is derived from (value_type, encoding,
// len(value_le)) at Create time and pinned for the scan's lifetime.
//
// Comparison op. Create accepts: eq | lt | gt | between | unknown.
// Refine also accepts: changed | unchanged | increased | decreased |
// increased_by | decreased_by.
//
// Values travel as raw little-endian bytes (max 32) rather than typed
// numbers so this proto stays int64-free for uint64 / double / string /
// utf16 (all of which lose precision or accuracy through some gRPC
// bindings' typed int fields).

enum ScanDiskSpillMode {
  SCAN_SPILL_AUTO = 0;    // RAM budget + disk per scan, both capped
  SCAN_SPILL_RAM_ONLY = 1; // refuse snapshots that would spill
}

// Returned by Status / Create. String avoids a brittle enum when the
// orchestrator only ever tag-compares.
//   "running"      — Create or Refine is in flight on the agent.
//   "done"         — snapshot stable, Fetchable.
//   "cancelled"    — Cancel observed between chunks. hits_so_far holds
//                    whatever was recorded before the cancel.
//   "error"        — agent-side failure; `error` names the cause.
//   "interrupted"  — agent restarted mid-scan; rehydrated from disk.
//   "capped"       — SCAN_DISK_MAX_BYTES or SCAN_SNAPSHOT_MAX_BYTES hit.
//   "timed_out"    — driven by the orchestrator deadline (25 s).

message ScanProgress {
  uint64 bytes_scanned = 1;
  uint64 bytes_total = 2;
  uint64 chunks_read = 3;
  uint64 chunks_skipped = 4;
  uint64 hits_so_far = 5;
  uint64 reads_failed = 6;
}

message ScanEntry {
  string scan_id = 1;
  uint32 pid = 2;
  MemSpace space = 3;
  string value_type = 4;
  uint32 width = 5;
  string status = 6;
  uint32 generation = 7;
  uint64 hit_count = 8;
  uint64 created_ts_ms = 9;
  string owner_client_id = 10;
  uint64 disk_bytes = 11;
  uint64 ram_bytes = 12;
}

message ScanCreateRequest {
  string scan_id = 1;            // orchestrator-assigned, e.g. "v0017"
  uint32 pid = 2;
  MemSpace space = 3;
  string value_type = 4;
  string endian = 5;             // "le" | "be" (ignored for strings)
  string encoding = 6;           // strings only: ascii|utf8|utf16le|utf16be
  uint32 align = 7;              // 1|2|4|8; relative to span start
  string op = 8;                 // eq|lt|gt|between|unknown
  bytes value_le = 9;            // LE bytes of `value`; max 32 bytes
  bytes value_hi_le = 10;        // op='between' only
  uint64 tolerance_bits = 11;    // float/double raw bits; 0 otherwise
  repeated ScanSpan spans = 12;  // resolved orchestrator-side
  uint64 max_results = 13;
  string owner_client_id = 14;
  ScanDiskSpillMode disk_spill_mode = 15;
}
message ScanCreateResponse {
  OpStatus status = 1;
  string scan_id = 2;
  string status_s = 3;           // "running" | "done" | ... (see enum above)
  uint32 generation = 4;
  ScanProgress progress = 5;
}

message ScanRefineRequest {
  string scan_id = 1;
  string op = 2;                 // eq|lt|gt|between|changed|unchanged|
                                 // increased|decreased|increased_by|decreased_by
  bytes value_le = 3;
  bytes value_hi_le = 4;
  bytes delta_le = 5;            // increased_by / decreased_by
  uint64 tolerance_bits = 6;
}
message ScanRefineResponse {
  OpStatus status = 1;
  string scan_id = 2;
  uint32 generation = 3;
  uint64 hit_count = 4;
  uint64 dropped = 5;
  uint64 reads_failed = 6;
  string status_s = 7;           // "running" | "done" | "cancelled" | ...
}

message ScanUndoRequest {
  string scan_id = 1;
}
message ScanUndoResponse {
  OpStatus status = 1;
  string scan_id = 2;
  uint32 generation = 3;
  uint64 hit_count = 4;
}

message ScanFetchRequest {
  string scan_id = 1;
  uint64 limit = 2;              // per-chunk cap; 0 = agent default
  uint64 offset = 3;              // row offset into the current generation
  uint32 generation = 4;          // expected generation; mismatch => error
}
message ScanRow {
  uint64 va = 1;
  bytes raw_value = 2;            // `width` bytes LE
}
message ScanFetchChunk {
  OpStatus status = 1;
  uint32 generation = 2;
  repeated ScanRow rows = 3;
  bool eof = 4;                   // final chunk
  uint64 total_remaining = 5;     // rows left after this chunk; informational
}

message ScanCancelRequest {
  string scan_id = 1;
}
message ScanCancelResponse {
  OpStatus status = 1;
  string scan_id = 2;
  string status_s = 3;            // "cancelled" | already-terminal state
}

message ScanDestroyRequest {
  string scan_id = 1;
}
message ScanDestroyResponse {
  OpStatus status = 1;
  string scan_id = 2;
  uint64 disk_bytes_freed = 3;
  uint64 ram_bytes_freed = 4;
}

message ScanListRequest {}
message ScanListResponse {
  OpStatus status = 1;
  repeated ScanEntry entries = 2;
}

message ScanStatusRequest {
  string scan_id = 1;
}
message ScanStatusResponse {
  OpStatus status = 1;
  string scan_id = 2;
  string status_s = 3;
  uint32 generation = 4;
  uint64 hit_count = 5;
  ScanProgress progress = 6;
  string error = 7;               // populated when status_s == "error"
}

service ScanService {
  rpc Create  (ScanCreateRequest)  returns (ScanCreateResponse);
  rpc Refine  (ScanRefineRequest)  returns (ScanRefineResponse);
  rpc Undo    (ScanUndoRequest)    returns (ScanUndoResponse);
  rpc Fetch   (ScanFetchRequest)   returns (stream ScanFetchChunk);
  rpc Cancel  (ScanCancelRequest)  returns (ScanCancelResponse);
  rpc Destroy (ScanDestroyRequest) returns (ScanDestroyResponse);
  rpc List    (ScanListRequest)    returns (ScanListResponse);
  rpc Status  (ScanStatusRequest)  returns (ScanStatusResponse);
}

// ============================================================================
// v17 — Memory scanner wave 2: PointerMapService + DissectService
// ============================================================================
//
// PointerMapService: snapshot every aligned pointer in a target process,
// reverse-scan for chains anchored on static image sections, diff two
// maps taken at different times (same process, possibly across reboots).
// State lives on the target; the orchestrator holds only lightweight
// bookkeeping (map_id, created_ts). Reuses ScanSpan + ScanDiskSpillMode
// from the Wave 1 surface. See an internal plan.
//
// DissectService: one-shot per-slot typed decode of a memory window.
// No new state. v16 agents fall back to orchestrator-side glue over
// memory_manage(action='read', decode=...).

message PointerMapProgress {
  uint64 regions_scanned   = 1;
  uint64 regions_total     = 2;
  uint64 bytes_scanned     = 3;
  uint64 bytes_total       = 4;
  uint64 candidates_so_far = 5;
  uint64 chunks_skipped    = 6;
}

message PointerMapCreateRequest {
  string map_id             = 1;    // orchestrator-assigned, e.g. "pm0017_0001"
  uint32 pid                = 2;
  MemSpace space            = 3;
  repeated ScanSpan spans   = 4;    // resolved orchestrator-side
  uint64 max_candidates     = 5;
  string owner_client_id    = 6;
  ScanDiskSpillMode disk_spill_mode = 7;
}
message PointerMapCreateResponse {
  OpStatus status           = 1;
  string map_id             = 2;
  string status_s           = 3;    // "running" | "done" | "cancelled" | ...
  PointerMapProgress progress = 4;
}

message PointerMapStatusRequest  { string map_id = 1; }
message PointerMapStatusResponse {
  OpStatus status           = 1;
  string map_id             = 2;
  string status_s           = 3;
  PointerMapProgress progress = 4;
  uint64 entries            = 5;
  uint64 disk_bytes         = 6;
  string error              = 7;
}

message PointerMapListRequest {}
message PointerMapListEntry {
  string map_id             = 1;
  uint32 pid                = 2;
  MemSpace space            = 3;
  string status_s           = 4;
  uint64 entries            = 5;
  uint64 disk_bytes         = 6;
  uint64 created_ts_ms      = 7;
  // true when the entry was
  // reconstructed from disk at Configure time and hasn't been mmap'd
  // yet — ``pointer_scan`` / ``pointer_map_diff`` against it will
  // refuse with "map not mmap'd" until the caller issues
  // ``pointer_map_load(remote_path=<spill_dir>)``. The orchestrator
  // surfaces this on list rows so callers don't have to catch the
  // mmap-not-ready error after a restart.
  bool   needs_load         = 8;
}
message PointerMapListResponse {
  OpStatus status           = 1;
  repeated PointerMapListEntry entries = 2;
}

message PointerMapCancelRequest  { string map_id = 1; }
message PointerMapCancelResponse {
  OpStatus status           = 1;
  string map_id             = 2;
  string status_s           = 3;    // "cancelled" | already-terminal state
}

message PointerMapSaveRequest {
  string map_id             = 1;
  string remote_path        = 2;    // target-side destination directory
}
message PointerMapSaveResponse {
  OpStatus status           = 1;
  uint64 bytes_written      = 2;
}

message PointerMapLoadRequest {
  string remote_path        = 1;    // target-side source directory
  string map_id             = 2;    // orchestrator-assigned new id
}
message PointerMapLoadResponse {
  OpStatus status           = 1;
  string map_id             = 2;
  uint64 entries            = 3;
}

message PointerMapDestroyRequest {
  string map_id             = 1;
  bool   keep_disk          = 2;
}
message PointerMapDestroyResponse {
  OpStatus status           = 1;
  uint64 ram_bytes_freed    = 2;
  uint64 disk_bytes_freed   = 3;
}

// Reverse pointer scan: BFS over (target → source) lookups using the
// map's by_target index. Terminates at static anchors (image sections)
// when static_only=true.
message PointerScanRequest {
  string map_id             = 1;
  uint64 target_va          = 2;
  uint32 max_depth          = 3;
  uint32 max_offset         = 4;
  bool   static_only        = 5;
  uint32 max_results        = 6;
  uint32 fanout_per_level   = 7;
  uint32 wall_ms            = 8;
}
message PointerScanChain {
  uint64 anchor_va          = 1;
  string anchor_module      = 2;    // "" when anchor is heap/stack/other
  uint64 anchor_module_off  = 3;
  string anchor_class       = 4;    // image_text|image_rdata|image_data|
                                    // image_unknown|heap|stack|other
  repeated uint64 offsets   = 5;
  bool   static_            = 6;
}
message PointerScanResponse {
  OpStatus status           = 1;
  repeated PointerScanChain chains = 2;
  bool   truncated          = 3;
  uint32 wall_ms_actual     = 4;
  uint64 candidates_examined = 5;
  // disambiguate ``truncated``. ``truncated``
  // stays set when ANY of these fire so older orchestrators still see
  // a single bool to branch on. The two new bools let a newer orchestrator
  // distinguish wall-exceeded (raise wall_ms) from fanout/max_results
  // (tighten scope) without the fragile ``wall_ms_actual > 0`` heuristic.
  bool   wall_exceeded      = 6;
  bool   fanout_exceeded    = 7;
}

// Diff two maps (same pid, possibly across a reboot). Linear pass;
// canonical identity is "<module!basename>!<offset>" via each map's
// stored module snapshot.
message PointerMapDiffRequest {
  string map_id_a           = 1;
  string map_id_b           = 2;
  bool   static_only        = 3;
  // Optional: filter the diff to chains that still resolve in map B.
  // Empty = diff every shared source_va (bounded by truncated flag).
  repeated PointerScanChain chains = 4;
}
message PointerMapDiffRow {
  uint64 source_va_a        = 1;
  uint64 source_va_b        = 2;    // 0 if gone
  uint64 target_va_a        = 3;
  uint64 target_va_b        = 4;
  string canonical_target   = 5;    // "<module>!<offset>" or ""
  bool   still_valid        = 6;
  string drift_reason       = 7;    // "" | "target_unmapped" |
                                    // "module_unloaded" | "value_changed"
}
message PointerMapDiffResponse {
  OpStatus status           = 1;
  repeated PointerMapDiffRow rows = 2;
  uint64 compared_entries   = 3;
  bool   truncated          = 4;
}

service PointerMapService {
  rpc Create  (PointerMapCreateRequest)  returns (PointerMapCreateResponse);
  rpc Status  (PointerMapStatusRequest)  returns (PointerMapStatusResponse);
  rpc List    (PointerMapListRequest)    returns (PointerMapListResponse);
  rpc Cancel  (PointerMapCancelRequest)  returns (PointerMapCancelResponse);
  rpc Save    (PointerMapSaveRequest)    returns (PointerMapSaveResponse);
  rpc Load    (PointerMapLoadRequest)    returns (PointerMapLoadResponse);
  rpc Destroy (PointerMapDestroyRequest) returns (PointerMapDestroyResponse);
  rpc Scan    (PointerScanRequest)       returns (PointerScanResponse);
  rpc Diff    (PointerMapDiffRequest)    returns (PointerMapDiffResponse);
}

// ---------------------------------------------------------------- Dissect ---

// Per-aligned-slot decode row. `probable_type` is the agent-side scored
// best guess; see an internal plan §3.3.
//
// pointer_* fields are populated when the slot's u64 value lands on a
// mapped region. target_va == 0 means "not a pointer or classification
// disabled". classification: image_text|image_rdata|image_data|
// image_unknown|heap|stack|code|"".
message DissectSlot {
  uint32 offset             = 1;    // byte offset into the dissected window
  uint64 va                 = 2;    // offset + request.address
  uint64 u64_le             = 3;    // raw 8-byte slot value (LE native)
  int32  i32_le             = 4;
  uint32 u32_le             = 5;
  float  f32_le             = 6;
  double f64_le             = 7;
  uint64 ptr_target_va      = 8;
  string ptr_module         = 9;
  uint64 ptr_module_off     = 10;
  string ptr_classification = 11;
  string ascii_prefix       = 12;   // up to 16 printable ASCII bytes or ""
  string utf16_prefix       = 13;   // up to 16 printable BMP wchars or ""
  string probable_type      = 14;   // pointer|utf16|ascii|f64|f32|i32
  // Scoring breakdown (fixed weights per §3.3). Determinism-pinned by
  // tests: ties broken in table order pointer > utf16 > ascii > f64 > f32.
  uint32 score_pointer      = 15;
  uint32 score_utf16        = 16;
  uint32 score_ascii        = 17;
  uint32 score_f64          = 18;
  uint32 score_f32          = 19;
}

message DissectRequest {
  uint32 pid                = 1;
  uint64 address            = 2;
  uint32 size               = 3;
  MemSpace space            = 4;
  bool   with_modules       = 5;    // resolve pointer targets to module!offset
  repeated string decode    = 6;    // "auto" or subset of
                                    // {i32,u32,f32,f64,ascii,utf16,pointer}
  uint32 align              = 7;    // 4 or 8; default 4 when 'auto'
}
message DissectResponse {
  OpStatus status           = 1;
  repeated DissectSlot slots = 2;
  // surface the agent-side
  // ``DISSECT_MAX_ROWS`` truncation so callers can tell "fewer rows than
  // size/align because the agent hit its cap" apart from "fewer rows
  // because the read was short". ``total_rows`` is what the agent would
  // have emitted without the cap; ``truncated`` is ``total_rows > rows``.
  uint32 total_rows         = 3;
  bool   truncated          = 4;
}

// multi-instance structure compare.
// See an internal plan §3.
//
// Decode N candidate base VAs of "same struct" and classify each
// aligned offset by variability class (stable / per_instance_ptr /
// per_instance_scalar / shared_pointer / noisy / unreadable /
// inconclusive) so the caller can tell field layout at a glance.
message DissectCompareRequest {
  uint32 pid                     = 1;
  repeated uint64 base_vas       = 2;  // 3..32 instances (min for stable class)
  uint32 window_size             = 3;  // bytes; caps at DISSECT_MAX_BYTES
  uint32 align                   = 4;  // 4 or 8
  MemSpace space                 = 5;  // 'user'|'kernel'
  bool   with_modules            = 6;  // classify pointer targets
  uint32 shared_ptr_min_vote     = 7;  // >= this many instances agree -> shared_pointer
  uint32 min_instances_for_class = 8;  // default 3; below this -> 'inconclusive'
}

message DissectOffsetClass {
  uint32 offset                   = 1;
  // 'stable' | 'per_instance_ptr' | 'per_instance_scalar' |
  // 'shared_pointer' | 'noisy' | 'unreadable' | 'inconclusive'
  string classification           = 2;
  uint32 distinct_values          = 3;  // across readable instances
  uint32 readable_instances       = 4;  // instances whose byte window covered this offset
  uint64 modal_value              = 5;  // most common u64 (LE) value
  uint32 modal_votes              = 6;
  string probable_type            = 7;  // best-of-N, same scoring as DissectSlot
  // For classification='shared_pointer' (or 'stable' with a pointer-
  // valued modal): the module the modal value points into, and the
  // offset within that module. Empty when with_modules=false or the
  // modal value isn't a module pointer.
  string shared_target_module     = 8;
  uint64 shared_target_module_off = 9;
}

// r2 nested-row form: ``unreadable=true`` means the window couldn't be
// read for this base_va; ``slots`` is empty in that case. One bad
// instance doesn't desync downstream readers.
message DissectInstanceSlots {
  uint64 base_va                 = 1;
  bool   unreadable              = 2;
  repeated DissectSlot slots     = 3;  // one per offset when readable
}

message DissectCompareResponse {
  OpStatus status                       = 1;
  repeated DissectOffsetClass offsets   = 2;
  repeated DissectInstanceSlots per_instance = 3;  // len == n_instances
  uint32 n_instances                    = 4;
  uint32 n_offsets                      = 5;
}

service DissectService {
  rpc Dissect (DissectRequest) returns (DissectResponse);
  // multi-instance compare. Gated on
  // StatusResponse.dissect_version >= 2.
  rpc Compare (DissectCompareRequest) returns (DissectCompareResponse);
}
