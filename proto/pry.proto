syntax = "proto3";

package pry;

// Single agent control plane. Every non-streaming response embeds OpStatus;
// streaming RPCs carry OpStatus in the first (header) message of the stream.
// v1 targets x64 only; addr_width fields are carried so the wire contract
// already supports a future x86/WOW64 mode.

message OpStatus {
  bool ok = 1;
  string error = 2;
  uint32 errno_code = 3;
  // optional typed error-kind slug the
  // agent sets so the orchestrator doesn't have to substring-match the
  // ``error`` text. Empty on older agents; the orchestrator
  // substring fallback (``_map_agent_error_kind``) handles those.
  string kind = 4;
}

// ---------------------------------------------------------------- Agent ----

enum DriverState {
  DRIVER_ABSENT = 0;
  DRIVER_SERVICE = 1;
  DRIVER_MANUAL_MAPPED = 2;
}

message StatusRequest {}
message StatusResponse {
  OpStatus status = 1;
  string agent_version = 2;
  string os_version = 3;
  uint32 os_build = 4;
  bool testsigning = 5;
  bool hvci = 6;
  bool secureboot = 7;
  DriverState driver_state = 8;
  string driver_version = 9;
  bool patchguard_expected = 10;
  // v7: milliseconds since the agent process started. 0 on pre-v7 agents.
  // target_manage(action='crash_state') diff's this vs the last successful
  // call's wall-clock to detect a mid-session reboot.
  uint64 agent_uptime_ms = 11;
  // v14: unix-ms of the last system boot (derived from GetTickCount64) and a
  // random per-agent-process id. Lets an orchestrator tell "same machine,
  // new boot" apart from "same boot, agent restarted" without diffing
  // uptimes by hand. 0/"" on agents that predate the fields.
  uint64 boot_epoch_ms = 12;
  string agent_instance_id = 13;
  // network identity echo. Lets the orchestrator
  // self-heal machine endpoints when DHCP moves the box — the IPs the
  // agent sees are authoritative where ARP/mDNS/getaddrinfo lie. Empty
  // on agents that predate the field.
  repeated AdapterInfo ipv4 = 14;
  // v16 (Memory scanner wave 1): advertises ScanService availability.
  //   0 — service absent (pre-v16 agents, or Phase B agents that
  //       ship the proto but no handlers → UNIMPLEMENTED on every
  //       method). Orchestrator falls back to legacy orchestrator-
  //       RAM scans (128 MiB cap, no disk spill).
  //   1 — Phase C+ handlers present; on-target snapshots + disk
  //       spill operational. Orchestrator routes value_scan /
  //       next_scan / scan_undo through ScanService.
  // See an internal plan §2.4 (v15
  // fallback) and §3.5 (ScanService shape).
  uint32 scan_service_version = 15;
  // v17 (Memory scanner wave 2): advertises PointerMapService +
  // DissectService availability.
  //   0 — services absent (pre-v17 agents, or Phase C-K agents
  //       that ship the proto but have the flag clamped at 0).
  //       Orchestrator refuses pointer-map ops with
  //       kind='needs_v17'; dissect falls back to the v16
  //       orchestrator-side implementation.
  //   1 — Phase L+ handlers wired and flag flipped; on-target
  //       pointer-map snapshots, reverse scan, diff, and the
  //       in-process dissector are all live.
  // See an internal plan §2.3 and §2.9.
  uint32 pointer_map_version = 16;
  // Advertises
  // DissectService availability independently of PointerMapService so
  // the orchestrator stops using ``pointer_map_version`` as a proxy
  // gate for the Wave 2 Dissect handler.
  //   0 — handler absent (older agent, or agent with no
  //       DissectService registered on this view).
  //   1 — Wave 2 handler registered; Wave 3 P1 flips this to 2 once
  //       ``Dissect.Compare`` lands.
  // See an internal plan §A.0.
  uint32 dissect_version = 17;
  // advertises
  // ``Memory.HeapAttribLookup`` availability — a per-pid interval-tree
  // reverse index built on top of WalkHeaps, so ``VA -> {heap_handle,
  // segment, chunk_base, chunk_size, flags, size_class}`` is O(log n)
  // after the first snapshot. Lives alongside WalkHeaps on the kernel
  // view; the umagent view does not carry the handler and reports 0.
  //   0 — handler absent (older agent, or a view with no
  //       HeapAttrib registration). Orchestrator refuses the new verb
  //       with ``kind='feature_unavailable'`` and the caller sees a
  //       named hint pointing at the gate.
  //   1 — handler registered; the orchestrator routes
  //       ``memory_manage(action='heap_attrib')`` through it.
  // See an internal plan §7.
  uint32 memory_heap_attrib_version = 18;
  // Driver ABI gate, reported so the
  // orchestrator can refuse a mismatched driver instead of misparsing it.
  //   driver_abi_version — PRY_PING_OUT.AbiVersion of the loaded
  //                        driver; 0 when no driver answered PING.
  //   agent_abi_version  — PRY_ABI_VERSION this agent was built with
  //                        (0 on umagent: it has no driver).
  //   driver_abi_ok      — true only when a driver is loaded AND both
  //                        versions match. While a loaded driver
  //                        mismatches, driver-backed RPCs answer
  //                        FAILED_PRECONDITION ("driver_abi_mismatch").
  uint32 driver_abi_version = 19;
  uint32 agent_abi_version = 20;
  bool driver_abi_ok = 21;
}

// Unauthenticated identity probe. The ONLY
// method either server answers without a bearer token, so an orchestrator
// can confirm which machine/process sits behind an endpoint BEFORE it
// sends the token there. Carries no secrets.
message IdentifyRequest {}
message IdentifyResponse {
  string computer_name = 1;       // GetComputerNameW (NetBIOS), UTF-8
  uint64 boot_epoch_ms = 2;       // same value StatusResponse reports
  string agent_instance_id = 3;   // same value StatusResponse reports
  string agent_version = 4;       // same value StatusResponse reports
  string view_kind = 5;           // "kernel" (agent) | "user" (umagent)
}

// one entry per IPv4 unicast address learned via
// GetAdaptersAddresses. The orchestrator uses this both for the registry
// observed_endpoints self-heal and for the Phase 2.4 rediscover MAC-filter
// path.
message AdapterInfo {
  string adapter      = 1; // FriendlyName, e.g. "Ethernet 2"
  string address      = 2; // dotted IPv4
  uint32 prefix_len   = 3; // 0..32
  string origin       = 4; // "dhcp" | "static" | "unknown"
  string gateway      = 5; // first default gateway IPv4 on this adapter, else ""
  string mac          = 6; // "aa:bb:cc:dd:ee:ff"
  bool   up           = 7; // operational status (IfOperStatusUp)
}

message DriverLoadRequest {
  enum Method {
    SERVICE = 0;      // test-signed service via SCM (NtLoadDriver path)
    MANUAL_MAP = 1;   // custom mapper exe; HVCI must be off
  }
  Method method = 1;
  string image_path = 2;   // default: agent install dir pry_driver.sys
  string mapper_path = 3;  // manual map only, default: agent dir mapper.exe
}
message DriverUnloadRequest {
  bool delete_service = 1; // service path: stop + delete (reboot fallback documented)
}

// Bounce-and-swap a service binary on the target. The agent generates and
// detached-spawns an on-target .cmd that stops the service, force-kills any
// leftover process holding the old image, moves the live exe aside into
// prev\, promotes the staged upload, restarts the service, health-checks the
// listen port, and rolls back on failure. Works for the agent itself
// (PryAgent) and the umagent (PryUmagent).
message SelfUpdateRequest {
  string service_name = 1;  // PryAgent | PryUmagent
  string exe_path = 2;      // live binary, e.g. C:\pry\pry_agent.exe
  string staged_path = 3;   // uploaded replacement, e.g. ...\pry_agent.new
  string sha256 = 4;        // optional: refuse swap if staged file mismatches
  string listen_port = 5;   // health check after restart (e.g. "50074")
}

// v5: agent-side crash breadcrumb — the driver op ring persisted to
// %ProgramData%\pry\breadcrumb.bin. Survives an agent restart, so a
// caller can ask "what was in flight when you died" and get an answer
// even after SCM burned its 3-restart budget. The in-memory ring holds
// the current run's calls; on startup the agent replays the last
// on-disk snapshot from the previous run into `prior_ops`.
message RecentOpsRequest {
  uint32 limit = 1;      // 0 -> full ring (64)
  bool include_prior = 2; // include ops from the previous agent lifetime
}
message BreadcrumbOp {
  uint64 t_start_us = 1; // monotonic microseconds since agent start
  uint64 t_end_us = 2;   // 0 if still pending / never completed
  uint32 ioctl_code = 3; // PRY_IOCTL_*
  string arg_summary = 4;
  uint32 status_code = 5; // NTSTATUS or GLE
  string status_kind = 6; // "pending" | "ok" | "error" | "wedged"
  uint64 latency_us = 7;  // t_end - t_start when known
}
message RecentOpsResponse {
  OpStatus status = 1;
  repeated BreadcrumbOp current = 2; // this agent lifetime
  repeated BreadcrumbOp prior = 3;   // from the last shutdown snapshot (agent's prior run)
  uint64 agent_start_epoch_ms = 4;
  uint64 now_epoch_ms = 5;
}

// v8: broad target-machine fingerprint. Status stays cheap and answers the
// "can I load the driver?" question; HostInfo answers "what am I running
// on?" — identity (user/computer/domain), full OS release (product name,
// display version, UBR), security posture (secure boot, VBS, driver
// blocklist, LSA-PPL, CPU features, kernel debugger), and optionally
// hardware and installed security products. All reads are observational —
// no writes and no touch of the analyst-host defensive posture (see
// docs/REVERSEKIT_REVIEW.md scope discipline).
message HostInfoRequest {
  bool include_security_products = 1; // WSC enum (may need SYSTEM); empty on failure
  bool include_hardware = 2;          // CPUID + phys mem + hypervisor tag
}
message SecurityProduct {
  string name = 1;
  string state = 2;    // "on" | "off" | "expired" | "snoozed" | "unknown"
  string version = 3;
  string kind = 4;     // "av" | "firewall" | "antispyware"
}
message HostInfoResponse {
  OpStatus status = 1;

  // ---- Identity (driver-free, cheap) ----
  string computer_name       = 2;  // GetComputerNameExW(NetBIOS)
  string dns_hostname        = 3;  // GetComputerNameExW(DnsFullyQualified)
  string domain              = 4;  // joined domain / workgroup
  string logged_on_user      = 5;  // active console session user (WTSGetActiveConsoleSessionId)
  string agent_run_as        = 6;  // whoever the agent process is running as
  bool   is_elevated         = 7;  // agent token elevation

  // ---- OS ----
  string product_name        = 10; // "Windows 11 Pro" (registry ProductName)
  string edition_id          = 11; // "Professional"  (registry EditionID)
  string display_version     = 12; // "25H2"          (registry DisplayVersion)
  string release_id          = 13; // "2609"          (registry ReleaseId)
  uint32 build_major         = 14; // 26200           (RtlGetVersion)
  uint32 build_ubr           = 15; // 9186            (registry UBR)
  string full_build_string   = 16; // convenience: "26200.9186"
  string install_date        = 17; // ISO8601 from registry InstallDate
  string boot_time           = 18; // ISO8601 (now - GetTickCount64)
  string timezone            = 19; // dynamic timezone key name
  string arch                = 20; // "x64" | "arm64" | "wow64"

  // ---- Security posture ----
  // For each flag: `<name>_source` is "driver" (verified by loaded driver),
  // "registry" (usermode registry read), "api" (Nt/Win32 API), "unknown" (probe
  // failed). The orchestrator wraps this into the {value, confidence, note}
  // envelope for LLM consumption; callers get the raw pair here.
  bool testsigning           = 30;
  string testsigning_source  = 31;
  bool hvci                  = 32;
  string hvci_source         = 33;
  bool secureboot            = 34;
  string secureboot_source   = 35;
  bool kernel_debugger       = 36; // NtQuerySystemInformation(KernelDebuggerInformation)
  string kernel_debugger_source = 37;
  bool vbs_enabled           = 38;
  string vbs_source          = 39;
  bool credential_guard      = 40;
  string credential_guard_source = 41;
  bool driver_blocklist_on   = 42; // HKLM\...\CI\Config\VulnerableDriverBlocklistEnable
  string driver_blocklist_source = 43;
  bool lsa_protected         = 44; // HKLM\...\Lsa\RunAsPPL
  string lsa_protected_source = 45;
  bool smep                  = 46;
  bool smap                  = 47;
  bool cet_shstk             = 48;
  string patchguard_state    = 49; // "expected" | "kd_disables_pg" | "unknown"
  // Kernel VA Shadow (Meltdown mitigation) — bit 0 of the
  // SYSTEM_KERNEL_VA_SHADOW_INFORMATION dword returned by
  // NtQuerySystemInformation(SystemKernelVaShadowInformation=196).
  bool   kva_shadow          = 50;
  string kva_shadow_source   = 51;

  // ---- Hardware (optional; empty when include_hardware=false) ----
  string cpu_brand           = 60;
  uint32 cpu_cores           = 61; // physical cores
  uint32 cpu_logical         = 62; // logical processors
  uint64 phys_mem_bytes      = 63;
  string hypervisor_vendor   = 64; // "Microsoft Hv" | "VMwareVMware" | "KVMKVMKVM" | "VBoxVBoxVBox" | ""
  bool   is_vm               = 65;

  // ---- Uptime ----
  uint64 pc_uptime_ms        = 66; // GetTickCount64() — since last cold/warm boot
  uint64 agent_uptime_ms     = 67; // current pry_agent process lifetime
  uint64 service_uptime_ms   = 68; // pry_agent service lifetime per SCM (0 if not
                                   // running as a service or SCM query fails)

  // ---- Security products (optional) ----
  repeated SecurityProduct security_products = 70;

  // ---- Collector diagnostics — one string per probe that failed, so the
  // orchestrator can render honest "we couldn't check X" gaps instead of
  // silently reporting a default value as truth.
  repeated string probe_errors = 90;

  // ---- network identity echo. The IPv4 unicast
  // addresses the agent sees via GetAdaptersAddresses — the orchestrator
  // compares these to its last-known endpoint to detect NIC flaps and
  // feeds the rediscover candidate list.
  repeated AdapterInfo ipv4 = 95;
}

// ------------------------- Static IPv4 pin ----
// Deploy-time wiring reads/sets the agent's pinned adapter via the agent
// config file; this RPC lets an orchestrator inspect current state and
// (optionally) trigger a one-shot re-pin without a service restart.
message NetPinStatusRequest {}
message NetPinStatusResponse {
  OpStatus status = 1;
  bool enabled = 2;             // config-level enable
  bool hold = 3;                // PRY_NET_PIN_HOLD marker is set
  string adapter = 4;           // configured FriendlyName
  string pinned_address = 5;    // configured static IPv4
  uint32 pinned_prefix = 6;
  string pinned_gateway = 7;
  string current_address = 8;   // what the adapter currently has
  uint64 last_pin_at_epoch_ms = 9;
  uint32 pin_attempts = 10;
  uint32 pin_failures_streak = 11;
  string last_error = 12;
}
message NetPinApplyRequest {
  bool clear_hold = 1;          // drop the hold marker then re-pin
}
message NetPinApplyResponse {
  OpStatus status = 1;
  bool applied = 2;
  string details = 3;
}

service NetPin {
  rpc Status(NetPinStatusRequest) returns (NetPinStatusResponse);
  rpc Apply(NetPinApplyRequest) returns (NetPinApplyResponse);    // one-shot re-pin
}

// ------------------------------------------------------- Screen / UI (v15) ----
//
// Visual inspection of the interactive desktop. The Session-0 service cannot
// see user-desktop windows (EnumWindows is window-station scoped), so every
// capture / enumeration runs in a short-lived re-launch of the agent binary
// inside the active console session (CreateProcessAsUserW + --screenshot) and
// ships results back over an anonymous pipe (screen_common.hpp wire header).

message WindowRect {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message WindowDetail {
  uint64 hwnd = 1;              // HWND cast to uint64
  string title = 2;
  WindowRect rect = 3;          // WINDOWINFO.rcWindow
  bool is_foreground = 4;
  bool is_minimized = 5;
  int32 z_order = 6;            // EnumWindows order, 0 = top-most
  // ---- v15 detailed metadata (populated when include_details, default
  // true); mirrors the JSON keys emitted by window_enum.cpp 1:1 ----
  string class_name = 7;        // GetClassNameW
  WindowRect client_rect = 8;   // WINDOWINFO.rcClient
  uint32 style = 9;             // WINDOWINFO.dwStyle
  uint32 exstyle = 10;          // WINDOWINFO.dwExStyle
  uint32 window_status = 11;    // WINDOWINFO.dwWindowStatus
  uint32 border_cx = 12;        // WINDOWINFO.cxWindowBorders
  uint32 border_cy = 13;        // WINDOWINFO.cyWindowBorders
  uint32 show_cmd = 14;         // WINDOWPLACEMENT.showCmd (1=normal 2=min 3=max)
  WindowRect normal_pos = 15;   // WINDOWPLACEMENT.rcNormalPosition
  uint64 parent = 16;           // WINDOWINFO.hwndParent
  uint64 owner = 17;            // GetWindow(hwnd, GW_OWNER)
  uint32 pid = 18;
  uint32 tid = 19;
  string process_path = 20;     // QueryFullProcessImageNameW ("" if denied)
  uint64 hinstance = 21;        // GetWindowLongPtrW(GWL_HINSTANCE)
  bool visible = 22;            // IsWindowVisible
  bool enabled = 23;            // IsWindowEnabled
  bool maximized = 24;          // IsZoomed
  bool topmost = 25;            // WS_EX_TOPMOST
  bool layered = 26;            // WS_EX_LAYERED
  bool tool_window = 27;        // WS_EX_TOOLWINDOW
  bool cloaked = 28;            // DWMWA_CLOAKED (UWP suspended etc.)
  uint32 dpi = 29;              // GetDpiForWindow (worker is per-monitor-v2 aware)
  uint32 window_type_atom = 30; // WINDOWINFO.atomWindowType
  // ---- EnumPropsExW + child tree
  // (additive, default-off; populated when the request carries
  // include_props / include_children). Proto3 allows a message to
  // reference itself in a `repeated` field so WindowDetail.children
  // is legal here. ----
  repeated WindowProp props = 31;        // EnumPropsExW output
  repeated WindowDetail children = 32;   // depth-capped tree builder
}

// one EnumPropsExW entry.
message WindowProp {
  string name = 1;         // GlobalGetAtomNameW output (or ANSI prop name)
  uint32 atom = 2;         // 0 when name was a string prop (atom < 0xC000)
  uint64 data = 3;         // HANDLE value cast to uint64
}

message ProcessWindowGroup {
  uint32 pid = 1;
  string process_name = 2;
  repeated WindowDetail windows = 3;
}

message ScreenCaptureRequest {
  string mode = 1;             // "desktop" | "window" | "list" | "displays"
  string display_id = 2;       // desktop mode: "" (primary), "1", or "DISPLAY1"
  uint64 hwnd = 3;             // window mode: exact HWND (else pid/title/process_name)
  uint32 pid = 4;              // window mode: topmost visible window of pid; list mode: filter
  string window_title = 5;     // window mode: substring match (resolved in the worker)
  uint32 max_dimension = 6;    // orchestrator-side only; the agent captures native
  string format = 7;           // "png"
  bool include_windows = 8;    // carry window telemetry JSON in the capture response
  bool include_hidden = 9;     // false (default) = visible windows only
  bool include_details = 10;   // full per-window metadata (default true)
  string process_name = 11;    // window mode: topmost window of this exe; list mode: filter
  string query = 12;           // list mode: substring across window titles/classes
}

message ScreenCaptureResponse {
  OpStatus status = 1;
  bytes image_data = 2;        // in-memory PNG bytes (empty for list/displays)
  string target_type = 3;      // "desktop" | "window" | "displays" | "list"
  string target_name = 4;      // e.g. "DISPLAY1" or "notepad.exe"
  uint32 width = 5;
  uint32 height = 6;
  uint64 timestamp_unix_ms = 7;
  string windows_json = 8;     // raw worker telemetry JSON (processes/displays)
}

message WindowListRequest {
  uint32 pid = 1;              // 0 = all
  string process_name = 2;     // filter by exe name (e.g. "cmd.exe")
  string query = 3;            // substring search across window titles/classes
  bool include_hidden = 4;     // false (default) = visible windows only
  bool include_details = 5;    // full metadata per window (default true)
  // ---- Additive, default off ----
  bool include_children = 6;   // recurse via EnumChildWindows per top-level HWND
  bool include_props = 7;      // trigger EnumPropsExW on every enumerated HWND
}

message WindowListResponse {
  OpStatus status = 1;
  string windows_json = 2;     // authoritative payload from the session-1 worker
  uint32 total_windows = 3;    // parsed orchestrator-side
}

// single-window EnumPropsExW walk.
message ListWindowPropsRequest {
  uint64 hwnd = 1;              // target HWND
  bool include_values = 2;      // default true — attach the HANDLE values
}
message ListWindowPropsResponse {
  OpStatus status = 1;
  uint64 hwnd = 2;
  repeated WindowProp props = 3;
}

// parent/child/owner tree builder.
// hwnd=0 roots at GetDesktopWindow(); max_depth clamps the EnumChildWindows
// recursion.
message GetWindowTreeRequest {
  uint64 hwnd = 1;              // 0 = GetDesktopWindow()
  uint32 pid = 2;               // 0 = any
  uint32 max_depth = 3;         // 0 defaults to 12
  bool include_props = 4;       // nest EnumPropsExW per node
}
message GetWindowTreeResponse {
  OpStatus status = 1;
  WindowDetail root = 2;        // self-referential children tree
}

// target_manage.reboot — reliable InitiateShutdownW on the agent
// side. Reboot/Shutdown/PowerOff route through InitiateShutdownW with the
// composed flag word; Logoff goes to ExitWindowsEx; Abort calls
// AbortSystemShutdownW. The response snapshots pre-reboot identity
// BEFORE touching anything so a partial failure still tells the
// orchestrator what the baseline looked like.
message RebootRequest {
  enum Mode {
    MODE_UNSPECIFIED = 0;  // treated as REBOOT
    REBOOT           = 1;
    SHUTDOWN         = 2;  // power off (SHUTDOWN_NOREBOOT)
    POWEROFF         = 3;  // SHUTDOWN_POWEROFF — ACPI off
    LOGOFF           = 4;  // ExitWindowsEx(EWX_LOGOFF)
    ABORT            = 5;  // AbortSystemShutdown — cancel a pending one
  }
  Mode   mode              = 1;
  uint32 delay_s           = 2;  // 0 → fire immediately
  bool   force             = 3;  // SHUTDOWN_FORCE_OTHERS
  bool   force_if_hung     = 4;  // SHUTDOWN_FORCE_SELF
  string reason            = 5;  // free text, mirrored into event log
  uint32 reason_code       = 6;  // SHTDN_REASON_* (default:
                                 //   MAJOR_OTHER | MINOR_OTHER | FLAG_PLANNED)
  bool   wait_pre_shutdown = 7;  // keep SHUTDOWN_GRACE_OVERRIDE off
}

message RebootResponse {
  bool   ok                            = 1;
  // Snapshotted BEFORE the call — survives a partial-failure return.
  uint64 boot_epoch_ms_at_issue        = 2;
  string agent_instance_id_at_issue    = 3;
  uint32 win32_error                   = 4;  // 0 on success
  string message                       = 5;
  uint32 mode_applied                  = 6;
  uint32 delay_s_applied               = 7;
}

service Agent {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc DriverLoad(DriverLoadRequest) returns (OpStatus);
  rpc DriverUnload(DriverUnloadRequest) returns (OpStatus);
  rpc SelfUpdate(SelfUpdateRequest) returns (OpStatus);
  rpc RecentOps(RecentOpsRequest) returns (RecentOpsResponse);
  rpc HostInfo(HostInfoRequest) returns (HostInfoResponse);
  rpc CaptureScreen(ScreenCaptureRequest) returns (ScreenCaptureResponse);
  rpc ListWindows(WindowListRequest) returns (WindowListResponse);
  rpc ListWindowProps(ListWindowPropsRequest) returns (ListWindowPropsResponse);
  rpc GetWindowTree(GetWindowTreeRequest) returns (GetWindowTreeResponse);
  // reliable InitiateShutdownW reboot verb (additive, no ABI bump).
  rpc Reboot(RebootRequest) returns (RebootResponse);
  // unauthenticated identity probe (see IdentifyRequest).
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
}

// --------------------------------------------------------------- Input ----
// desktop input injection. umagent runs in the interactive
// session (session 1) so SendInput reaches the user desktop; the
// session-0 agent service cannot serve these RPCs, so Input lives on
// umagent only. Actuator-trust gated: callers below
// security.min_trust_actuator must pass force=true (same gate as
// process_manage(kill)).

enum InputButton {
  INPUT_LEFT = 0;
  INPUT_RIGHT = 1;
  INPUT_MIDDLE = 2;
  INPUT_X1 = 3;
  INPUT_X2 = 4;
}

enum InputAction {
  INPUT_DOWN = 0;
  INPUT_UP = 1;
  INPUT_CLICK = 2;      // DOWN + UP pair
}

message InputClickRequest {
  // screen-space coordinates. x == -1 && y == -1 → operate on the
  // current cursor position without moving it.
  int32 x = 1;
  int32 y = 2;
  InputButton button = 3;
  InputAction action = 4;
  // Modifier bitfield applied around the click:
  //   bit 0 = shift, 1 = ctrl, 2 = alt, 3 = win
  uint32 modifiers = 5;
  // 1 = single click, 2 = double click. 0 is normalized to 1.
  uint32 click_count = 6;
  // Below security.min_trust_actuator, true bypasses the trust gate.
  bool force = 7;
}

message InputTypeRequest {
  // UTF-8 text; translated to VK codes via VkKeyScanW. Code points that
  // VkKeyScanW cannot reach are emitted as KEYEVENTF_UNICODE pairs.
  string text = 1;
  // Optional per-character delay (Sleep(delay_ms) between code points).
  uint32 delay_ms = 2;
  bool force = 3;
}

message InputKeyRequest {
  // "Escape", "F5", "Ctrl+C", "Shift+Tab" style strings. Parsed into
  // modifier VKs + a single key VK, then emitted in down-up order.
  string key = 1;
  InputAction action = 2;        // CLICK = down + up
  uint32 repeat = 3;             // 0 normalized to 1
  bool force = 4;
}

message InputResponse {
  OpStatus status = 1;
}

service Input {
  rpc Click(InputClickRequest) returns (InputResponse);
  rpc Type(InputTypeRequest) returns (InputResponse);
  rpc Key(InputKeyRequest) returns (InputResponse);
}

// --------------------------------------------------------------- Memory ----

enum MemSpace {
  USER = 0;
  KERNEL = 1;
  PHYSICAL = 2;
}

message MemoryReadRequest {
  uint32 pid = 1;          // ignored for KERNEL/PHYSICAL
  uint64 address = 2;
  uint64 size = 3;         // capped by agent config (default 8 MiB per call)
  MemSpace space = 4;
  uint32 addr_width = 5;   // 64 default, 32 reserved
  bool allow_fault = 6;    // kernel space: permit driver soft-fault of
                           // non-resident PAGEDATA (default: fail cleanly)
  bool partial = 7;        // v6 kernel space: per-4KB walk, stop at first
                           // unmapped page and return the valid prefix
                           // (STATUS_PARTIAL_COPY). Kills the "1 MB chunk
                           // fails atomically on one bad page" workflow.
  // vNEXT (T3.1 PR#5): physical-space default-deny for out-of-RAM reads.
  // Reading PCI device MMIO (xHCI, GPU, NIC) through MmCopyMemory/
  // MmMapIoSpaceEx has wedged the box in the field. Default (false) causes
  // the driver to refuse any physical address outside MmGetPhysicalMemoryRanges
  // with STATUS_ACCESS_DENIED. Setting true restores the pre-guard behaviour
  // for operators who have accepted the wedge risk. Ignored for USER/KERNEL
  // spaces. Older agents without this field silently fall through to the
  // pre-guard behaviour; the orchestrator warns in that case.
  bool allow_mmio = 8;
  uint64 max_bytes = 10;   // v9: driver-side hard byte cap independent of `size`
                           // (0 = uncapped; when set, clips to min(size, max_bytes))
}
message MemoryReadResponse {
  OpStatus status = 1;
  bytes data = 2;
  uint64 read_bytes = 3;
  uint64 first_bad_offset = 4;  // v6, partial=true only: bytes into the
                                 // request where the walk stopped (== data.size()
                                 // when a hole was hit; 0 when the whole range
                                 // succeeded).
}

message MemoryWriteRequest {
  uint32 pid = 1;
  uint64 address = 2;
  bytes data = 3;
  MemSpace space = 4;
  uint32 addr_width = 5;
  bool allow_map_write = 6; // physical space: opt into the driver's
                            // MmMapIoSpaceEx write path (ABI v5). Default
                            // refused; unmappable pages surface as
                            // written_bytes < len(data), not an error.
  // v12: 0 = current/system CR3. Nonzero writes through the caller-supplied
  // address space (kernel space only; the driver verifies the target CR3
  // shares the kernel half before swapping).
  uint64 cr3 = 7;
  // v12: PRY_MEM_WRF_* bits. Bit0 STRICT_VA: a kernel write faults on
  // the direct VA path -> STATUS_INVALID_ADDRESS, never the phys-remap
  // fallback (fallback silently bypasses linear-address watchpoints).
  uint32 flags = 8;
}
message MemoryWriteResponse {
  OpStatus status = 1;
  uint64 written_bytes = 2;
  // v12: which store path ran. 0 unknown (pre-v12 agent/driver),
  // 1 direct_va (the target linear VA), 2 phys_remap (page-table walk +
  // physical map — DR watchpoints on the linear address did NOT see this
  // store), 3 foreign_cr3 (direct VA under the request's cr3).
  uint32 write_path = 3;
}

message MemoryAllocRequest {
  uint32 pid = 1;          // user-mode allocation
  bool kernel = 2;         // true: pool alloc in kernel, pid ignored
  uint64 size = 3;
  uint32 protect = 4;      // Win32 PAGE_* constant, user-mode only
  uint32 addr_width = 5;
}
message MemoryAllocResponse {
  OpStatus status = 1;
  uint64 address = 2;
}

message MemoryFreeRequest {
  uint32 pid = 1;
  bool kernel = 2;
  uint64 address = 3;
}
message MemoryFreeResponse { OpStatus status = 1; }

message MemoryProtectRequest {
  uint32 pid = 1;
  uint64 address = 2;
  uint64 size = 3;
  uint32 protect = 4;
  uint32 addr_width = 5;
}
message MemoryProtectResponse {
  OpStatus status = 1;
  uint32 old_protect = 2;
}

message ModuleInfo {
  string name = 1;
  string path = 2;
  uint64 base = 3;
  uint64 size = 4;
  bool kernel = 5;
}
message ModulesRequest {
  uint32 pid = 1;
  bool kernel = 2;         // true: PsLoadedModuleList walk, pid ignored
  int32 limit = 3;         // v9: 0 = no cap; agent slices response
  int32 offset = 4;
}
message ModulesResponse {
  OpStatus status = 1;
  repeated ModuleInfo modules = 2;
}

message PatternScanRequest {
  uint32 pid = 1;
  uint64 base = 2;         // 0 = scan all committed user space of pid
  uint64 size = 3;         // 0 = till end of region chain
  bytes pattern = 4;
  string mask = 5;         // '?' wildcard, len == pattern length; empty = exact.
                          // the wire mask is byte-granular; nibble
                          // wildcards from pattern tokens ('6?'/'?F') are
                          // compiled to '?' client-side and candidates are
                          // post-verified via mem_read.
  MemSpace space = 6;      // USER default; KERNEL supported (driver read path)
  uint32 max_results = 7;  // default 64
}
message PatternScanResponse {
  OpStatus status = 1;
  repeated uint64 addresses = 2;
}

// server-streaming pattern scan. Solves the 16 GB
// kernel-scan blowing the MCP deadline: chunks come back as they land
// and the orchestrator can tear down the stream mid-scan.
message PatternScanChunk {
  OpStatus status = 1;
  repeated uint64 addresses = 2;   // matches accumulated in THIS chunk
  uint64 bytes_scanned = 3;        // running total since scan_start
  uint64 cursor = 4;               // current VA at chunk emission
  bool done = 5;                   // final chunk (success, cap, or early stop)
}

message VadEntry {
  uint64 start = 1;          // inclusive VA
  uint64 end = 2;            // exclusive VA
  uint32 protect = 3;        // Win32 PAGE_* (guard/nocache variants included)
  uint32 vad_type = 4;
  uint64 commit_charge = 5;
}
message VadRequest {
  uint32 pid = 1;
  int32 limit = 2;         // v9: 0 = no cap
  int32 offset = 3;
}
message VadResponse {
  OpStatus status = 1;
  repeated VadEntry entries = 2;
}

message HandleEntry {
  uint64 object = 1;
  uint64 handle = 2;
  uint32 granted_access = 3;
  uint32 type_index = 4;
  string type_name = 5;
  string name = 6;           // only when want_names (File objects stay unnamed)
}
message HandleListRequest {
  uint32 pid = 1;
  bool want_names = 2;       // slow: resolves object names
  int32 limit = 3;           // v9: 0 = no cap
  int32 offset = 4;
}
message HandleListResponse {
  OpStatus status = 1;
  repeated HandleEntry handles = 2;
}

message ProcessInfo {
  uint32 pid = 1;
  uint32 parent_pid = 2;
  string image_name = 3;
  // v14: usermode enrichment (NtQuerySystemInformation(SystemProcessInfo))
  // — present even when the driver is absent, which is exactly when the
  // caller most needs process discovery. cmdline is empty on protected/PPL
  // processes and when the request didn't opt in.
  string cmdline = 4;
  uint64 create_time_100ns = 5;  // FILETIME ticks since 1601 (SPI CreateTime)
  uint32 session_id = 6;
}
message ListProcessesRequest {
  int32 limit = 1;           // v9: 0 = no cap
  int32 offset = 2;
  // v14: per-pid PEB cmdline walk (OpenProcess + ReadProcessMemory). Slower
  // on large lists and empty for protected processes — opt-in.
  bool with_cmdline = 3;
}
message ListProcessesResponse {
  OpStatus status = 1;
  repeated ProcessInfo processes = 2;
  // v14: which enumerator produced the rows — "agent" (NtQSI usermode,
  // no driver needed) or "driver" (last-ditch fallback). Callers use it
  // to gauge freshness/coverage.
  string source = 3;
}

message IatEntry {
  string dll = 1;              // declared source DLL from the import descriptor
  string name = 2;             // export name; empty when imported by ordinal
  uint32 ordinal = 3;          // valid iff name == "" (IMAGE_ORDINAL_FLAG set)
  uint64 iat_slot = 4;         // VA of the FirstThunk slot in the caller image
  uint64 resolved = 5;         // pointer currently in the slot
  string resolved_module = 6;  // module owning `resolved`, empty if none
  bool hooked = 7;             // basename(resolved_module) != basename(dll)
}
message ModuleImportsRequest {
  uint32 pid = 1;
  string module = 2;           // basename or full path
  bool kernel = 3;             // walk kernel view (pid ignored)
  int32 limit = 4;             // v9: 0 = no cap
  int32 offset = 5;
}
message ModuleImportsResponse {
  OpStatus status = 1;
  repeated IatEntry entries = 2;
}

message ExportEntry {
  string name = 1;
  uint32 ordinal = 2;
  uint64 rva = 3;
  uint64 address = 4;          // base + rva
  string forwarder = 5;        // e.g. "api-ms-...!Foo"; empty for regular exports
}
message ModuleExportsRequest {
  uint32 pid = 1;
  string module = 2;
  bool kernel = 3;
  int32 limit = 4;             // v9: 0 = no cap
  int32 offset = 5;
}
message ModuleExportsResponse {
  OpStatus status = 1;
  repeated ExportEntry entries = 2;
}

message HeapBlock {
  uint64 address = 1;
  uint64 size = 2;
  uint32 flags = 3;            // RTL_HEAP_ENTRY flags (BUSY/EXTRA/...)
}
message HeapEntry {
  uint64 handle = 1;           // HEAP* (target VA)
  uint32 flags = 2;
  uint64 base = 3;
  uint64 committed = 4;
  uint64 reserved = 5;
  repeated HeapBlock blocks = 6;   // populated iff want_blocks
}
message HeapListRequest {
  uint32 pid = 1;
  bool want_blocks = 2;
  uint32 max_blocks = 3;       // per-heap cap, 0 = 4096 default
}
message HeapListResponse {
  OpStatus status = 1;
  repeated HeapEntry heaps = 2;
}

// v4 additions: physical-range enumeration and kernel big-pool scan.
message PhysRangesRequest {
  int32 limit = 1;             // v9: 0 = no cap
  int32 offset = 2;
}
message PhysRangeEntry {
  uint64 base = 1;
  uint64 size = 2;
  uint32 kind = 3; // 0 = RAM (only kind currently produced)
}
message PhysRangesResponse {
  OpStatus status = 1;
  repeated PhysRangeEntry ranges = 2;
}

message PoolScanRequest {
  uint32 tag_filter = 1;   // 4-char tag packed LE as uint32, or 0 for any
  bool nonpaged_only = 2;
  bool paged_only = 3;
  uint32 max_results = 4;
  bytes pattern = 5;       // raised to <=64 bytes
  bytes mask = 6;          // same length as pattern; 0 or '?' = wildcard byte
  uint32 offset = 7;       // start byte of the content window inside each entry
  uint32 content_span = 8; // raised to <=64 KiB
  // resumable scans. The response's next_cursor echoes
  // where the driver stopped; passing it back resumes from that entry
  // (0 = fresh scan). Needed to drive wide sweeps that would otherwise
  // blow max_results silently.
  uint32 cursor = 9;
}
message PoolBlock {
  uint64 virtual_address = 1;
  uint64 size_in_bytes = 2;
  uint32 tag = 3;
  string tag_ascii = 4;    // decoded 4-char pool tag for readability
  bool nonpaged = 5;
  uint64 matched_offset = 6; // absolute VA of the pattern hit, 0 when no content filter
}
message PoolScanResponse {
  OpStatus status = 1;
  repeated PoolBlock entries = 2;
  uint32 required = 3;    // total big-pool entries seen before filter
  uint32 considered = 4;  // after tag/paged filter, before content filter
  // scan telemetry. holes counts entries where the
  // content read failed (previously silent `continue`); span_truncated
  // counts entries whose content span was clipped; last_index is the
  // driver's internal scan cursor; next_cursor is the resume point for
  // the next call (0 means the scan completed).
  uint32 holes = 5;
  uint32 span_truncated = 6;
  uint32 last_index = 7;
  uint32 next_cursor = 8;
}

// v5: server-streaming reads for >4 MiB ranges. Removes the manual-chunk
// dance for callers who want a single logical read (dxgkrnl image dump,
// full ranged pattern-scan seed, etc.). Reuses MemoryReadRequest; each
// chunk carries its own offset so a caller can reassemble streams that
// interleave under retries or reorder in transit.
message MemoryReadChunk {
  OpStatus status = 1;    // set on the first (and any error) chunk only
  uint64 offset = 2;      // bytes from start of the requested range
  bytes data = 3;         // <= server_chunk_bytes (default 1 MiB)
  bool eof = 4;           // set on the final chunk (data may still be non-empty)
}

// v7: VA -> PA translation via the driver's page-table walk. The
// PRY_FUNC_VA_TRANSLATE IOCTL shipped in ABI v5 (drv_exerciser vatrans
// exercised it) but had no gRPC surface until v7. v12 adds USER space
// (pid -> KeStackAttachProcess -> process CR3) and a caller-supplied cr3
// override for foreign-address-space walks.
message VaTranslateRequest {
  MemSpace space = 1;   // KERNEL or USER (v12); PHYSICAL refused
  uint32 pid = 2;       // USER: process whose tables are walked; 0 = agent's
  uint64 va = 3;
  uint64 cr3 = 4;       // v12: explicit CR3 to walk under; 0 = resolved from
                        // space/pid (system CR3 for KERNEL, process CR3 for USER)
}
message VaTranslateResponse {
  OpStatus status = 1;
  uint64 pa = 2;
  bool present = 3;             // page mapped under the walked CR3
  uint64 cr3 = 4;               // CR3 the walk actually used (v12; 0 pre-v12)
  uint32 page_size_shift = 5;   // 12 (4 KiB), 21 (2 MiB), 30 (1 GiB); 0 unknown
}

// v12: per-CPU IDT dump. The driver __sidt's each requested processor and
// decodes KIDTENTRY64 rows itself — 256 x 16 B per CPU fits the out-buffer
// without an agent-side kernel read per entry. Row idt_base records the
// IDTR base of the CPU that row was read on (per-CPU tables differ; a
// drifted base is a detour signature for the caller to score).
message IdtListRequest {
  bool all_cpus = 1;      // false = the servicing CPU's IDT only
}
message IdtEntryRow {
  uint32 cpu = 1;         // processor index the row was read on
  uint32 vector = 2;
  uint64 handler_va = 3;  // decoded offset_lo|mid|hi
  uint32 selector = 4;
  uint32 ist = 5;
  uint32 dpl = 6;
  uint64 idt_base = 7;    // IDTR.Base of the CPU this row came from
}
message IdtListResponse {
  OpStatus status = 1;
  uint64 idt_base = 2;              // IDTR.Base of the first CPU read
  uint32 idt_limit = 3;             // its IDTR.Limit (typically 0xFFF)
  repeated IdtEntryRow entries = 4;
}

// v7: agent-side memory polling. The agent spawns one worker thread per
// active watch; each thread MemReads `length` bytes every `interval_ms`
// via the same routing as Memory.Read (user/kernel/physical), compares
// with the previous window, and emits a WatchEvent on transition. The
// worker terminates when duration_s elapses, max_events is reached, the
// client cancels the stream, the agent shuts down, or too many
// consecutive read failures accumulate. Agent-side cap on concurrent
// watches (config PRY_MAX_WATCHES, default 8) and an interval floor
// (config PRY_WATCH_MIN_MS, default 10 ms) so a runaway request cannot
// convert the target into a busy loop.
message WatchRequest {
  MemSpace space = 1;         // USER/KERNEL/PHYSICAL — same routing as Memory.Read
  uint32 pid = 2;             // USER only; 0 for KERNEL/PHYSICAL
  uint64 address = 3;
  uint32 length = 4;          // up to 256 bytes — small-object watcher
  uint32 interval_ms = 5;     // floor at server-side minimum (default 10 ms)
  uint32 duration_s = 6;      // 0 = server default (60 s), max cap enforced
  bytes expected_hex = 7;     // empty = report every change; non-empty = report
                              // only when the current value != expected. Length
                              // must match `length` when set.
  uint32 max_events = 8;      // 0 = unlimited (bounded by duration_s + agent cap)
  string tag = 9;             // free-form label surfaced in each event
}
message WatchEvent {
  OpStatus status = 1;        // set on the first message with ok=true, and on
                              // termination messages when the watch ended
                              // uncleanly (read fail, cap hit, etc.)
  uint64 seq = 2;             // 1-indexed
  uint64 ts_ms = 3;           // milliseconds since unix epoch
  bytes prev = 4;             // last known bytes (empty on the first sample)
  bytes now = 5;              // current bytes
  bool eof = 6;               // set on the final message
  string reason = 7;          // populated when eof=true: duration|max_events|
                              // read_failed|cancelled|agent_shutdown
  bool read_failed = 8;       // when true, `now` is empty (last MemRead failed)
}

// ---- HeapAttrib — VA -> allocation ----
//
// Batched reverse index on top of WalkHeaps. The agent builds an
// interval tree per (pid, epoch) on the first lookup and answers
// O(log n) thereafter. Cache invalidation combines three signals: an
// age TTL (default 2000 ms), a committed-sum delta probe (rebuild if
// the new WalkHeaps summary moves by max(1 MiB, 1%)), and the explicit
// ``refresh=true`` request flag. All three paths return
// ``index_from_cache=false`` and a fresh ``cache_epoch`` in the
// response. See an internal plan §7.
message HeapAttribRequest {
  uint32 pid = 1;
  // One or more VAs to attribute in a single round-trip. Capped at
  // 4096 entries per call (HEAPATTRIB_MAX_VAS below); callers that
  // need more should page explicitly. An empty list is refused with
  // ``kind='bad_arg'``.
  repeated uint64 vas = 2;
  // Force a fresh WalkHeaps + index rebuild before answering, even
  // when the cache is within its TTL. Callers who need
  // moment-of-call freshness pass this; routine lookups ride the LRU.
  bool refresh = 3;
}

message HeapAttribRecord {
  uint64 va = 1;              // echoes the input VA so callers can zip
  bool found = 2;             // false when no heap block covers this VA
  uint64 heap_handle = 3;
  uint64 segment_base = 4;
  uint64 chunk_base = 5;
  uint64 chunk_size = 6;
  uint32 flags = 7;           // RTL_HEAP_ENTRY flags (BUSY/EXTRA/...)
  uint32 size_class = 8;      // nearest power-of-2 >= chunk_size (0 if unavailable)
}

message HeapAttribResponse {
  OpStatus status = 1;
  // One record per input VA, in request order. On a batch refusal
  // (``pid=0``, empty ``vas``, cap overflow) ``records`` is empty and
  // the status carries the kind.
  repeated HeapAttribRecord records = 2;
  // false when this call rebuilt the per-pid index (TTL expired,
  // committed-sum delta tripped, or ``refresh=true``). true otherwise.
  bool index_from_cache = 3;
  uint32 cache_epoch = 4;     // bumped on every rebuild
  uint64 cache_age_ms = 5;    // age of the served index at service time
  uint64 cache_committed_sum = 6;  // sum of committed bytes across heaps at index time
}

service Memory {
  rpc Read(MemoryReadRequest) returns (MemoryReadResponse);
  rpc Write(MemoryWriteRequest) returns (MemoryWriteResponse);
  rpc Alloc(MemoryAllocRequest) returns (MemoryAllocResponse);
  rpc Free(MemoryFreeRequest) returns (MemoryFreeResponse);
  rpc Protect(MemoryProtectRequest) returns (MemoryProtectResponse);
  rpc Modules(ModulesRequest) returns (ModulesResponse);
  rpc Scan(PatternScanRequest) returns (PatternScanResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc VadList(VadRequest) returns (VadResponse);
  rpc HandleList(HandleListRequest) returns (HandleListResponse);
  rpc ModuleImports(ModuleImportsRequest) returns (ModuleImportsResponse);
  rpc ModuleExports(ModuleExportsRequest) returns (ModuleExportsResponse);
  rpc HeapList(HeapListRequest) returns (HeapListResponse);
  rpc PhysicalRanges(PhysRangesRequest) returns (PhysRangesResponse);
  rpc PoolScan(PoolScanRequest) returns (PoolScanResponse);
  rpc ReadStream(MemoryReadRequest) returns (stream MemoryReadChunk);
  rpc VaTranslate(VaTranslateRequest) returns (VaTranslateResponse);          // v7
  rpc Watch(WatchRequest) returns (stream WatchEvent);                        // v7
  rpc ThreadList(ThreadListRequest) returns (ThreadListResponse);             // v11
  rpc ObjEnum(ObjEnumRequest) returns (ObjEnumResponse);                      // v11
  rpc IdtList(IdtListRequest) returns (IdtListResponse);                      // v12
  // cancellable server-streaming Scan. Legacy unary
  // Scan stays for the small whole-space calls. The chunk stream lets
  // the orchestrator tear down mid-scan without the agent's loop
  // continuing to sweep — the handler polls ctx->IsCancelled() between
  // chunks and returns immediately when the client disconnects.
  rpc ScanStream(PatternScanRequest) returns (stream PatternScanChunk);
  // segment-heap decode. Separate from the
  // existing HeapList (which is a per-heap summary) — HeapInfo decodes
  // _SEGMENT_HEAP contents (SegContexts, page descriptors, LFH buckets).
  rpc HeapInfo(HeapInfoRequest) returns (HeapInfoResponse);
  // batched VA -> heap allocation
  // attribution. See HeapAttribRequest / HeapAttribResponse for the
  // cache/invalidation contract; gated on
  // StatusResponse.memory_heap_attrib_version >= 1 by the
  // orchestrator.
  rpc HeapAttribLookup(HeapAttribRequest) returns (HeapAttribResponse);
}

// ---- segment-heap decode ----
message HeapInfoRequest {
  uint32 pid = 1;
  uint64 heap_filter = 2;      // 0 => every heap in the process
  bool include_segments = 3;   // SegContext page-descriptor walk
  bool include_lfh_buckets = 4; // LFH bucket + variable-size state
}
message HeapInfoSegment {
  uint64 va = 1;               // segment base
  string kind = 2;             // "backend" | "variable_size" | "large"
  uint64 committed = 3;
  uint64 reserved = 4;
  uint32 descriptors_count = 5;
}
message HeapInfoEntry {
  uint64 handle = 1;
  string heap_class = 2;       // "nt_heap" | "segment_heap"
  string size_type = 3;        // "small" | "large" | "huge"
  string front_end_type = 4;   // "lookaside" | "lfh" | "none"
  string lock_status = 5;      // "unlocked" | "locked_by_tid=N"
  string class_name = 6;       // "default" | "shared" | "debug"
  uint32 global_flags = 7;
  uint64 total_reserved_pages = 8;
  uint64 total_committed_pages = 9;
  repeated HeapInfoSegment segments = 10;
  string warnings = 11;        // "unknown_build" / "pattern_fallback" / ...
}
message HeapInfoResponse {
  OpStatus status = 1;
  repeated HeapInfoEntry heaps = 2;
  string coverage = 3;         // "complete" | "partial"
  string hint = 4;             // populated on partial coverage
}

// ---------------------------------------------------------------- Debug ----

message Registers {
  uint64 rax = 1;
  uint64 rcx = 2;
  uint64 rdx = 3;
  uint64 rbx = 4;
  uint64 rsp = 5;
  uint64 rbp = 6;
  uint64 rsi = 7;
  uint64 rdi = 8;
  uint64 r8 = 9;
  uint64 r9 = 10;
  uint64 r10 = 11;
  uint64 r11 = 12;
  uint64 r12 = 13;
  uint64 r13 = 14;
  uint64 r14 = 15;
  uint64 r15 = 16;
  uint64 rip = 17;
  uint32 rflags = 18;
  // DR0..DR7 widened to uint64 (x64 debug registers are 64-bit).
  // Field tags 19..24 are unchanged — wire-compatible for small-value reads
  // and the intended fix for writes that were silently truncated.
  uint64 dr0 = 19;
  uint64 dr1 = 20;
  uint64 dr2 = 21;
  uint64 dr3 = 22;
  uint64 dr6 = 23;
  uint64 dr7 = 24;
  uint32 gs_base_low = 25;   // informational, read-only
  uint64 fs_base = 26;
  uint64 gs_base = 27;
}

message StepRequest {
  enum Kind {
    STEP_INTO = 0;
    STEP_OVER = 1;
  }
  Kind kind = 1;
  uint64 count = 2; // default 1
  // Opt into StopInfo.regs / bytes_at_rip_hex on
  // the post-step snapshot. Exception stops fill them automatically
  // regardless of this flag.
  bool include_context = 3;
}
message StepResponse {
  OpStatus status = 1;
  // post-step stop snapshot. Populated when the step resolves to a
  // stop (within the engine's internal wait); empty on timeout / monitor-mode
  // auto-resume. Additive — old clients see the field as unknown and ignore.
  StopInfo state = 2;
}

message GetRegsRequest {
  // optional explicit tid (0 = current thread).
  uint32 tid = 1;
}
message GetRegsResponse {
  OpStatus status = 1;
  Registers regs = 2;
  // Per-register failures are surfaced here as
  // "<reg>:<reason>" instead of failing the whole call. Order is not
  // guaranteed; entries map 1:N to registers that could not be read.
  repeated string warnings = 3;
}
message SetRegsRequest {
  Registers regs = 1;   // fields present != 0 are applied
  bool apply_rip = 2;
  bool apply_rflags = 3;
  bool apply_dr = 4;
  bool apply_gprs = 5;
  // optional explicit tid (0 = current thread).
  uint32 tid = 6;
}
message SetRegsResponse {
  OpStatus status = 1;
  // Per-register write failures, same encoding as
  // GetRegsResponse.warnings.
  repeated string warnings = 3;
}

message ThreadInfo {
  uint32 tid = 1;
  uint64 teb = 2;
  uint32 suspend_count = 3;
  uint64 start_address = 4;
}
message GetThreadsRequest {}
message GetThreadsResponse {
  OpStatus status = 1;
  repeated ThreadInfo threads = 2;
  uint32 current_tid = 3;
}

message StackFrame {
  uint64 frame = 1;
  uint64 return_address = 2;
  string symbol = 3;
  uint64 displacement = 4;
  string module = 5;
}
message StacktraceRequest {
  uint32 max_frames = 1; // default 32
  // optional explicit tid (0 = current thread).
  uint32 tid = 2;
}
message StacktraceResponse {
  OpStatus status = 1;
  repeated StackFrame frames = 2;
}

message MemoryRegionsRequest {
  uint32 pid = 1;
  int32 limit = 2;             // v9: 0 = no cap
  int32 offset = 3;
}
message MemoryRegion {
  uint64 base = 1;
  uint64 size = 2;
  uint32 state = 3;
  uint32 protect = 4;
  uint32 type = 5;
  string module = 6;
}
message MemoryRegionsResponse {
  OpStatus status = 1;
  repeated MemoryRegion regions = 2;
}

message DebugEvent {
  enum Kind {
    BREAKPOINT_SW = 0;
    BREAKPOINT_HW = 1;
    EXCEPTION = 2;
    PROCESS_EXIT = 3;
    THREAD_CREATE = 4;
    THREAD_EXIT = 5;
    MODULE_LOAD = 6;
    SESSION_STATUS = 7;
    // Symmetric module-unload event. `address` carries the
    // unloading module's image base (same convention as MODULE_LOAD).
    MODULE_UNLOAD = 8;
  }
  uint64 seq = 1;
  Kind kind = 2;
  uint32 tid = 3;
  uint64 address = 4;
  int32 exception_code = 5;
  string description = 6;
  uint64 timestamp_unix = 7;
  uint32 pid = 8;   // v12: owning process (single-session, but explicit)
  // bp id for BREAKPOINT_SW / BREAKPOINT_HW events; 0 otherwise.
  uint32 bp_id = 9;
  // first_chance flag on EXCEPTION events. False for second-chance
  // and non-exception events.
  bool first_chance = 10;
  // Module image base for MODULE_LOAD / MODULE_UNLOAD events.
  // `address` is kept for backward compat (same value); new code reads
  // module_base explicitly.
  uint64 module_base = 11;
}

message LaunchRequest {
  string cmdline = 1;
  string working_dir = 2;
  bool break_on_entry = 3;  // initial breakpoint event
  uint32 addr_width = 4;
  // symmetric with AttachRequest.monitor — auto-resume bp /
  // exception hits instead of staying stopped (passive-observation mode
  // for bp_manage events on freshly-launched targets).
  bool monitor = 5;
}
message LaunchResponse {
  OpStatus status = 1;
  uint32 pid = 2;
  uint32 initial_tid = 3;
}

message AttachRequest {
  uint32 pid = 1;
  bool monitor = 2; // auto-resume bp/exception hits instead of staying
                    // stopped — passive-observation mode (bp_manage events)
}
message DetachRequest {
  bool kill = 1; // false: detach cleanly, true: terminate
}
message ContinueRequest {
  // Opt into StopInfo.regs / bytes_at_rip_hex on
  // the post-continue stop snapshot (when one is produced before the
  // engine's internal wait elapses).
  bool include_context = 1;
}
message DebugReadRequest {
  uint64 address = 1;
  uint64 size = 2;
}
message DebugReadResponse {
  OpStatus status = 1;
  bytes data = 2;
}
message DebugWriteRequest {
  uint64 address = 1;
  bytes data = 2;
}
message DebugWriteResponse {
  OpStatus status = 1;
  // post-write stop snapshot (seq, active, stopped, rip, ...). A
  // write never changes execution state on its own, but echoing `state`
  // keeps the response shape uniform with the other mutating Debug RPCs
  // so the MCP state loop sees a `state` block on every mutation.
  StopInfo state = 2;
}

message StreamDebugEventsRequest {
  uint64 from_seq = 1;   // 0 = live from now; >0 replays buffered events first
}

message ExecuteCommandRequest {
  string command = 1;    // raw dbgeng command (e.g. "uf ntdll!NtCreateFile")
}
message ExecuteCommandResponse {
  OpStatus status = 1;
  string output = 2;
  // Post-command state echo. `cmd` can silently change the
  // target (`g`, `q`, `.detach`); clients read `state.stopped` /
  // `state.active` here to resync.
  StopInfo state = 3;
}

// ------------------------------------------- StopInfo ----
//
// Every mutating Debug RPC echoes a StopInfo so an MCP client never has to
// infer "is the target stopped right now?" from side channels. See
// docs/DEBUG_MCP.md for the state-loop cookbook.
message StopInfo {
  // Session is live (false after process_exit / clean detach).
  bool active = 1;
  // True when the target is parked under the debug engine.
  bool stopped = 2;
  // A waiting call (`wait`, `run`, `pause`, `run_to`, `step_out`) returned
  // because its timeout_ms elapsed, not because the target stopped. The
  // call is still `ok=true` in that case — timeout is not an error.
  bool timed_out = 3;
  uint32 pid = 4;
  uint32 tid = 5;
  // Instruction pointer at the stop. Called "rip" for continuity with the
  // x64 contract; for x86 / WOW64 targets this carries EIP (zero-extended).
  uint64 rip = 6;
  // Resolved symbol at `rip`: "module!name+0xNN". Empty when symbols are
  // unavailable or the engine refused the lookup.
  string symbol = 7;
  // Discriminator describing why the target is stopped. One of:
  //   "bp_sw" | "bp_hw" | "step" | "pause" | "exception" | "process_exit"
  //   | "attach" | "launch" | "monitor_hit" | "none"
  string stop_reason = 8;
  // DbgSession.seq_ at the moment the snapshot was taken. Monotonic within
  // a session; clients use it as an idempotency / staleness key.
  uint64 seq = 9;
  // "x64" | "x86" | "wow64". Detected once per session via
  // IDebugControl::GetEffectiveProcessorType.
  string arch = 10;
  // Non-zero on `stop_reason == "exception"`.
  uint32 exception_code = 11;
  // first_chance flag on the exception; false otherwise.
  bool first_chance = 12;
  // Non-zero on `stop_reason == "bp_sw" | "bp_hw"`.
  uint32 bp_id = 13;
  // GPR snapshot filled automatically on exception
  // stops, and on demand when the caller passes `include_context=true` on
  // Status/Pause/Wait/Run/RunTo/StepOut/Continue/Step. Empty otherwise.
  // Best-effort: a failed GetRegs leaves this empty, never fails the call.
  repeated Register regs = 14;
  // 16 bytes starting at `rip`, lowercase hex,
  // no separators. Filled with `regs`. Empty when ReadVirtual failed or
  // the enrichment path was not requested.
  string bytes_at_rip_hex = 15;
}

// compact name/value pair for StopInfo.regs. Keeps the wire small
// (vs. the full Registers message used by GetRegs) since the crash-context
// enrichment only needs the general-purpose set, not FPU / XMM state.
message Register {
  string name = 1;              // "rax", "rip", "rflags" ...
  uint64 value = 2;             // zero-extended on x86 / WOW64
}

// Generic OpStatus+StopInfo wrapper for mutating Debug RPCs whose only
// non-status output is the state echo (Pause, Wait, Run, RunTo, StepOut).
// Added as a new message rather than modifying OpStatus so other services
// stay wire-compatible.
message DebugOpStatus {
  OpStatus status = 1;
  StopInfo state = 2;
}

// Response wrappers for existing Attach/Detach/Continue RPCs — these three
// RPCs' return types change from `OpStatus` to a wrapper carrying the state
// echo. The wrapper embeds the OpStatus in field 1 so the
// surface shape mirrors DebugOpStatus.
message AttachResponse {
  OpStatus status = 1;
  StopInfo state = 2;
}
message DetachResponse {
  OpStatus status = 1;
  StopInfo state = 2;
}
message ContinueResponse {
  OpStatus status = 1;
  StopInfo state = 2;
}

// --- New Debug RPC messages ---------------------------------------------
//
// Every `timeout_ms` below is clamped server-side to [0, 30000] per §2 of
// an internal plan: 0 falls back to the per-verb
// default, and values > 30000 are capped at 30000. Timeouts return
// `ok=true` with `state.timed_out=true` — never gRPC DEADLINE_EXCEEDED.
message DebugStatusRequest {
  // Opt into StopInfo.regs / bytes_at_rip_hex.
  // Exception stops fill them unconditionally.
  bool include_context = 1;
}
message DebugStatusResponse {
  OpStatus status = 1;
  StopInfo state = 2;
}

message PauseRequest {
  uint32 timeout_ms = 1; // default 5000, cap 30000
  // Opt into StopInfo.regs / bytes_at_rip_hex.
  bool include_context = 2;
}

message WaitRequest {
  uint32 timeout_ms = 1; // default 20000, cap 30000
  // Opt into StopInfo.regs / bytes_at_rip_hex.
  bool include_context = 2;
}

message RunRequest {
  uint32 timeout_ms = 1; // default 20000, cap 30000
  // Opt into StopInfo.regs / bytes_at_rip_hex.
  bool include_context = 2;
}

message RunToRequest {
  uint64 address = 1;
  uint32 timeout_ms = 2; // default 20000, cap 30000
  // Opt into StopInfo.regs / bytes_at_rip_hex.
  bool include_context = 3;
}

message StepOutRequest {
  uint32 timeout_ms = 1; // default 20000, cap 30000
  // Opt into StopInfo.regs / bytes_at_rip_hex.
  bool include_context = 2;
}

// abort the in-flight engine op. pid=0 targets the current
// session; a non-zero pid is validated against the engine's attached pid
// for safety. Response state echoes the post-cancel snapshot. Always
// releases the caller's debug lease on success.
message CancelRequest { uint32 pid = 1; }
message CancelResponse {
  OpStatus status = 1;
  StopInfo state = 2;
}

message DisasmRequest {
  uint64 address = 1;
  uint32 count = 2;      // default 16
}
message DisasmLine {
  uint64 address = 1;
  string bytes_hex = 2;
  string text = 3;
}
message DisasmResponse {
  OpStatus status = 1;
  repeated DisasmLine lines = 2;
}

message ResolveRequest {
  // "module!name" or "module+0xN"; engines also accept bare numeric
  // addresses expressed as hex strings.
  string symbol = 1;
}
message ResolveResponse {
  OpStatus status = 1;
  uint64 address = 2;
  // Canonical "module!name+0xNN" form the engine resolved to.
  string canonical = 3;
}

message DebugDumpRequest {
  string path = 1;
  string kind = 2;       // "mini" | "full"
}
message DebugDumpResponse {
  OpStatus status = 1;
  string path = 2;
  uint64 bytes = 3;
}

message DebugModuleInfo {
  uint64 base = 1;
  uint64 size = 2;
  string name = 3;
  string path = 4;
  uint32 timestamp = 5;
  bool loaded = 6;
}
message DebugModulesRequest {}
message DebugModulesResponse {
  OpStatus status = 1;
  repeated DebugModuleInfo modules = 2;
}

message ExceptionFilterRequest {
  uint32 code = 1;
  string action = 2;     // "break" | "ignore" | "second_chance"
}
message ExceptionFilterResponse {
  OpStatus status = 1;
}

service Debug {
  rpc Launch(LaunchRequest) returns (LaunchResponse);
  // Attach/Detach/Continue return wrappers carrying StopInfo.
  rpc Attach(AttachRequest) returns (AttachResponse);
  rpc Detach(DetachRequest) returns (DetachResponse);
  rpc Continue(ContinueRequest) returns (ContinueResponse);
  rpc Step(StepRequest) returns (StepResponse);
  rpc GetRegs(GetRegsRequest) returns (GetRegsResponse);
  rpc SetRegs(SetRegsRequest) returns (SetRegsResponse);
  rpc GetThreads(GetThreadsRequest) returns (GetThreadsResponse);
  rpc Stacktrace(StacktraceRequest) returns (StacktraceResponse);
  rpc ReadMemory(DebugReadRequest) returns (DebugReadResponse);
  rpc WriteMemory(DebugWriteRequest) returns (DebugWriteResponse);
  rpc Regions(MemoryRegionsRequest) returns (MemoryRegionsResponse);
  rpc StreamEvents(StreamDebugEventsRequest) returns (stream DebugEvent);
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  // Synchronous state-aware verbs.
  rpc Status(DebugStatusRequest) returns (DebugStatusResponse);
  rpc Pause(PauseRequest) returns (DebugOpStatus);
  rpc Wait(WaitRequest) returns (DebugOpStatus);
  rpc Run(RunRequest) returns (DebugOpStatus);
  rpc RunTo(RunToRequest) returns (DebugOpStatus);
  rpc StepOut(StepOutRequest) returns (DebugOpStatus);
  rpc Disasm(DisasmRequest) returns (DisasmResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  rpc DebugDump(DebugDumpRequest) returns (DebugDumpResponse);
  rpc Modules(DebugModulesRequest) returns (DebugModulesResponse);
  rpc ExceptionFilter(ExceptionFilterRequest) returns (ExceptionFilterResponse);
  // SetInterrupt-backed abort for a wedged engine op.
  rpc Cancel(CancelRequest) returns (CancelResponse);
}

//                                                            Breakpoints ----

message BpAddRequest {
  enum Kind {
    SW = 0;   // int3 via debug engine
    HW = 1;   // DR0-3 via driver (kernel targets) or dbgeng data bp (user)
  }
  Kind kind = 1;
  uint64 address = 2;
  uint32 slot = 3;         // HW: 0-3
  uint32 size = 4;         // HW: 1,2,4,8
  string access = 5;       // HW: "exec", "write", "rw"
  bool kernel_target = 6;  // Display hint only. HW BPs always go
                           // through the driver — kernel_target is kept
                           // for backward compat + bp_list annotation.
  uint32 tid = 7;          // HW: 0 = all threads of process (or all threads
                           // system-wide when global=true)
  uint32 pid = 8;          // HW: owning process (ignored when global=true)
  bool global = 9;         // v6+: system-wide HW BP. Arms every thread of
                           // every process + PsSetCreateThreadNotifyRoutine
                           // catches newborns regardless of parent pid. Driver
                           // caps concurrent global BPs at 2.
  bool dangerous_ok = 10;  // v6+: bypass the PatchGuard-expected refusal
                           // (lab-only, PG-defanged VMs). Ignored unless
                           // global=true.
  bool via_debugger = 11;  // v12: route an HW bp through the dbgeng
                           // debug port (AddBreakpoint2/DATA) instead of
                           // the driver — used by the bp-events debug-port
                           // fallback on hypervisor guests. Requires an
                           // attached session on `pid`.
  // Richer bp semantics for SW / dbgeng-DATA bps. All five
  // fields are default-zero and the engine falls back to the legacy
  // behavior when they are empty / zero.
  //
  // `condition`: dbgeng expression evaluated at the hit. The engine wraps
  // it as `j (<condition>) 'gc'; 'gc'` so a false expression auto-continues
  // without surfacing the stop. Combined with `commands` when both are
  // present (see agent/src/dbg/dbg_bp.cpp for the exact composition).
  string condition = 12;
  // `commands`: dbgeng command list executed at hit (before any
  // one-shot cleanup appended by the engine).
  string commands = 13;
  // `pass_count`: ignore the first N-1 hits, break on hit N. 0 = no
  // pass-count filter (break on every hit).
  uint32 pass_count = 14;
  // `one_shot`: auto-remove the bp on its first observed hit (the engine
  // appends `; bc <id>; gc` to the final command string).
  bool one_shot = 15;
  // `match_tid`: for SW / dbgeng-DATA bps, only break when the hit tid
  // matches. 0 = any thread. Distinct from the HW `tid` field at tag 7,
  // which governs which threads a driver-side DRx bp is armed on.
  uint32 match_tid = 16;
}
message BpAddResponse {
  OpStatus status = 1;
  uint32 bp_id = 2;
}
message BpRemoveRequest { uint32 bp_id = 1; }
message BpListRequest {}
message BpEntry {
  uint32 bp_id = 1;
  string kind = 2;
  uint64 address = 3;
  uint32 slot = 4;
  string access = 5;
  bool enabled = 6;
  string description = 7;
  uint32 pid = 8;   // v12: driver-side bps carry their scope
  uint32 tid = 9;
  uint32 size = 10;
}
message BpListResponse {
  OpStatus status = 1;
  repeated BpEntry breakpoints = 2;
}
message BpSetEnabledRequest {
  uint32 bp_id = 1;
  bool enabled = 2;
}

service Breakpoints {
  rpc Add(BpAddRequest) returns (BpAddResponse);
  rpc Remove(BpRemoveRequest) returns (OpStatus);
  rpc List(BpListRequest) returns (BpListResponse);
  rpc SetEnabled(BpSetEnabledRequest) returns (OpStatus);
}

// ----------------------------------------------------------------- Files ----

message UploadHeader {
  string path = 1;
  uint64 size = 2;
}
message UploadChunk {
  oneof payload {
    UploadHeader header = 1;
    bytes data = 2;
  }
}
message UploadResponse {
  OpStatus status = 1;
  string path = 2;
  string sha256 = 3;
  uint64 bytes_written = 4;
}

message DumpedSection {
  string name = 1;        // section name (8-byte field, NUL-padded)
  uint64 va = 2;          // section RVA within the image
  uint64 size = 3;        // virtual size
  uint64 dumped_bytes = 4; // bytes actually read; the tail reads as zeros
  bool complete = 5;
}

message DownloadHeader {
  uint64 size = 1;
  string sha256 = 2;
  string notes = 3;     // dump metadata / repair notes
  repeated DumpedSection sections = 4; // per-section residency map
  // v14: content came from a VSS shadow copy because the live file is
  // share-mode-0 locked. Bytes are a point-in-time snapshot, not the live
  // file — the caller should expect staleness vs. concurrent writers.
  bool via_snapshot = 5;
}
message DownloadChunk {
  oneof payload {
    DownloadHeader header = 1;
    bytes data = 2;
  }
}
message DownloadRequest {
  string path = 1;
  uint64 offset = 2;   // default 0
  uint64 length = 3;   // 0 = to EOF
}
message DumpModuleRequest {
  uint32 pid = 1;
  string module = 2;   // name or full path
  bool quiesce = 3;    // suspend target around the dump for a consistent image
  string dump_type = 4; // "as_loaded" (default) | "unrelocated" (reverse relocs)
  bool kernel = 5;      // dump a kernel module from the PsLoadedModuleList view;
                        // pid ignored, quiesce skipped. Discarded PAGE/INIT
                        // sections read back as zeros.
}
message HashRequest { string path = 1; }
message HashResponse {
  OpStatus status = 1;
  string sha256 = 2;
  uint64 size = 3;
  // v14: hashed a VSS shadow copy (share-mode-0 locked live file). Digest is
  // of the snapshot, which can differ from the live file's final bytes.
  bool via_snapshot = 4;
}
message ListDirRequest {
  string path = 1;
  bool recursive = 2;
  uint32 max_entries = 3;
}
message DirEntry {
  string name = 1;
  bool dir = 2;
  uint64 size = 3;
  uint64 mtime_unix = 4;
}
message ListDirResponse {
  OpStatus status = 1;
  repeated DirEntry entries = 2;
}
message DeleteRequest {
  string path = 1;
  bool no_trash = 2; // default: move to agent trash dir; true = hard delete
}

// v7: agent-local file tail. Fixes the "234 MB kernel log pull" pattern —
// the agent opens the file with FILE_SHARE_READ|WRITE|DELETE, seeks from
// end, reads up to `bytes` (server caps at 4 MiB per call), and returns
// only the tail. When `line_align=true` the first partial line is stripped
// so the response is line-clean. include_rotated=true also stitches in the
// tail of <path>.old (see agent kernel-log rotation) with a marker.
message LogTailRequest {
  string path = 1;
  uint32 bytes = 2;           // 0 = 64 KiB default; server caps at 4 MiB
  bool from_end = 3;          // default true; false = read [0..bytes] from the start
  bool line_align = 4;        // strip partial first line so response is line-clean
  bool include_rotated = 5;   // also fetch and stitch <path>.old
}
message LogTailResponse {
  OpStatus status = 1;
  bytes data = 2;
  uint64 total_size = 3;      // total file size at read time
  uint64 tail_offset = 4;     // where the tail starts in the file
  bool truncated = 5;         // true when total_size > bytes returned
  uint64 rotated_size = 6;    // size of <path>.old when include_rotated=true
  // v14: tail read through a VSS shadow copy (share-mode-0 locked file).
  // total_size is the snapshot size; the live file may already be larger.
  bool via_snapshot = 7;
}

// v8: server-streaming `tail -f` — the agent opens the file (same share
// flags as LogTail) and pushes chunks as they land. Kills the "wedge lost
// the verdict" pattern: writes-per-line to disk survive the wedge, the
// stream lets the orchestrator SEE them without any polling. Rotation is
// detected on size shrink and reported via `rotated=true` chunks.
// Concurrency-capped agent-side by PRY_MAX_FOLLOWS (default 8).
message LogFollowRequest {
  string path = 1;
  uint64 from_offset = 2;         // 0 = start of file, UINT64_MAX = start at EOF
  uint32 initial_tail_bytes = 3;  // when from_offset==0: seek back this many bytes
                                  //   before starting the follow (0 = start at 0)
  uint32 poll_interval_ms = 4;    // 0 = 200 ms default; floor at 10 ms
  uint32 max_chunk_bytes = 5;     // 0 = 64 KiB default; capped at 4 MiB
  bool line_align = 6;            // trim to last '\n' each chunk
  bool follow_rotation = 7;       // reopen path when size shrinks
  uint32 duration_s = 8;          // 0 = 600 s default; hard cap 3600 s
  uint64 max_bytes = 9;           // 0 = unlimited within duration
}
message LogFollowChunk {
  OpStatus status = 1;    // set on the first message; and on any terminal chunk
  uint64 offset = 2;      // absolute file offset of this chunk's first byte
  bytes data = 3;
  bool rotated = 4;       // true = reopened after a rotation (data may be empty)
  uint64 new_total_size = 5;  // file size after this chunk (0 if unknown)
  bool eof = 6;
  string reason = 7;      // eof=true: duration|max_bytes|cancelled|io_error|
                          //           path_gone|agent_shutdown|cap
  // v14: stat-follow degrade. true = the file can't be opened for content
  // (share-mode-0 lock) — this chunk reports a metadata change only
  // (size/mtime via GetFileAttributesExW); `data` is empty and `offset`
  // stays pinned. The follow keeps retrying the real open and returns to
  // data chunks the moment the lock clears.
  bool stat_only = 8;
}

service Files {
  rpc Upload(stream UploadChunk) returns (UploadResponse);
  rpc Download(DownloadRequest) returns (stream DownloadChunk);
  rpc DumpModule(DumpModuleRequest) returns (stream DownloadChunk);
  rpc Hash(HashRequest) returns (HashResponse);
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  rpc Delete(DeleteRequest) returns (OpStatus);
  rpc LogTail(LogTailRequest) returns (LogTailResponse);        // v7
  rpc LogFollow(LogFollowRequest) returns (stream LogFollowChunk); // v8
}

// ------------------------------------------------------------------ Exec ----

enum ShellKind {
  CMD = 0;
  POWERSHELL = 1;
}

message RunExeRequest {
  string exe = 1;
  repeated string args = 2;
  string working_dir = 3;
  uint64 timeout_ms = 4;      // 0 = 30s default
  bool hidden_window = 5;     // default true
}
message RunExeResponse {
  OpStatus status = 1;
  uint32 exit_code = 2;
  bytes stdout_data = 3;
  bytes stderr_data = 4;
  uint64 timed_out = 5;
  // v7: true when the agent had to kill the child on timeout. stdout_data
  // / stderr_data still carry whatever flushed before the kill.
  bool killed = 6;
}

message RunShellRequest {
  ShellKind shell = 1;
  string command = 2;
  string working_dir = 3;
  uint64 timeout_ms = 4;
  // base64-of-UTF-16LE command, spawned as
  // ``powershell -EncodedCommand <b64>``. Immune to the double-parse
  // mangling that bites ``-Command <quoted>`` on embedded quotes,
  // backticks, newlines, and non-ASCII. Agent prefers encoded_command
  // over command when both are set and shell==POWERSHELL. Empty on
  // callers that predate this field.
  string encoded_command = 5;
}
message RunShellResponse {
  OpStatus status = 1;
  uint32 exit_code = 2;
  bytes output = 3;
}

message StartShellRequest {
  ShellKind shell = 1;
  string working_dir = 2;
}
message StartShellResponse {
  OpStatus status = 1;
  uint32 session_id = 2;
}
message WriteConsoleRequest {
  uint32 session_id = 1;
  bytes input = 2;
}
message ReadConsoleRequest {
  uint32 session_id = 1;
  uint64 max_bytes = 2;
  uint64 timeout_ms = 3;
}
message ConsoleData {
  OpStatus status = 1;
  bytes data = 2;
  bool eof = 3;
  uint32 session_id = 4;
}
message ShellSessionRequest { uint32 session_id = 1; }
message StreamConsoleRequest { uint32 session_id = 1; }

message KillProcessRequest { uint32 pid = 1; }
message PidRequest { uint32 pid = 1; }

// v7: first-class detached execution. Spawns with CREATE_NEW_PROCESS_GROUP;
// stdout/stderr redirected to per-handle files under
// %ProgramData%\pry\detached\<handle_id>\{stdout,stderr}.log unless
// overridden. Returns immediately with a handle for poll/tail/kill.
message RunDetachedRequest {
  string cmdline = 1;
  string working_dir = 2;
  string stdout_path = 3;      // empty = default under ProgramData
  string stderr_path = 4;
  bool hidden_window = 5;      // default true
  // extra environment variables for the child. The agent merges
  // these on top of its own inherited environment and passes the result to
  // CreateProcess. Used by the ``log_path=`` sugar on the orchestrator side
  // to force per-runtime unbuffered output (``PYTHONUNBUFFERED=1`` etc.)
  // without the caller having to set it on their own shell.
  map<string, string> env = 6;
}
message RunDetachedResponse {
  OpStatus status = 1;
  string handle_id = 2;        // 24-char hex, agent-generated
  uint32 pid = 3;
  string stdout_path = 4;      // absolute path chosen by the agent
  string stderr_path = 5;
  uint64 started_ts = 6;       // unix millis
}
message DetachedHandleRequest { string handle_id = 1; }
message DetachedStatusResponse {
  OpStatus status = 1;
  bool running = 2;
  uint32 exit_code = 3;        // valid when running=false
  uint64 stdout_size = 4;
  uint64 stderr_size = 5;
  uint64 exited_ts = 6;        // unix millis, 0 while running
  string stdout_path = 7;
  string stderr_path = 8;
  uint32 pid = 9;
}
message DetachedTailRequest {
  string handle_id = 1;
  uint32 bytes = 2;            // 0 = 64 KiB default
  bool stderr_too = 3;         // include stderr tail
}
message DetachedTailResponse {
  OpStatus status = 1;
  bytes stdout_tail = 2;
  bytes stderr_tail = 3;
  uint64 stdout_total = 4;
  uint64 stderr_total = 5;
}

// v14: enumerate live shell session ids — a caller that lost track (or hit
// a transport arg-marshaling bug that delivered session_id=0) can recover
// without spawning a new shell.
message ListShellsRequest {}
message ListShellsResponse {
  OpStatus status = 1;
  repeated uint32 session_ids = 2;
}

// v15: Exec.CallFunction — synchronous in-context function call. CALL_USER
// injects a param-block trampoline + remote thread in pid; CALL_KERNEL runs
// Target inside a driver work item at PASSIVE_LEVEL. Both return rax plus
// failure detail. Gated by security.allow_function_call (default off) — this
// is the strongest actuator in the stack.
enum CallSpace {
  CALL_USER = 0;
  CALL_KERNEL = 1;
}

message CallFunctionRequest {
  uint64 pid = 1;                 // CALL_USER only (ignored for CALL_KERNEL)
  uint64 target_va = 2;           // function VA in the call's space
  repeated fixed64 args = 3;      // ms64 order; <= 16 (4 regs + 12 stack)
  CallSpace space = 4;
  uint32 timeout_ms = 5;          // 0 = 30 s default
  uint32 flags = 6;               // bit0 kill_on_timeout (user);
                                  // bit1 force (kernel: skip VA checks)
}
message CallFunctionResponse {
  OpStatus status = 1;            // transport-level op result (arg errors etc.)
  uint64 return_value = 2;        // rax / function return
  uint32 last_error = 3;          // user: TEB LastErrorValue post-call
  uint64 exit_code = 4;           // user: thread exit code (NTSTATUS when crashed)
  bool timed_out = 5;
  bool exception = 6;             // kernel: SEH caught; user: exit_code in error range
  uint64 exception_code = 7;
  uint64 thread_tid = 8;          // user: spawned tid (post-timeout inspection)
  uint64 stub_va = 9;             // user: stub+param page (cleanup on timeout)
}

service Exec {
  rpc RunExe(RunExeRequest) returns (RunExeResponse);
  rpc RunShell(RunShellRequest) returns (RunShellResponse);
  rpc StartShell(StartShellRequest) returns (StartShellResponse);
  rpc ConsoleWrite(WriteConsoleRequest) returns (OpStatus);
  rpc ConsoleRead(ReadConsoleRequest) returns (ConsoleData);
  rpc StopShell(ShellSessionRequest) returns (OpStatus);
  rpc StreamConsole(StreamConsoleRequest) returns (stream ConsoleData);
  rpc ListShells(ListShellsRequest) returns (ListShellsResponse); // v14
  rpc KillProcess(KillProcessRequest) returns (OpStatus);
  rpc Suspend(PidRequest) returns (OpStatus); // NtSuspendProcess (target quiescence)
  rpc Resume(PidRequest) returns (OpStatus);  // NtResumeProcess
  // v15: synchronous in-context function call (remote thread for CALL_USER,
  // driver work item for CALL_KERNEL). Gated by security.allow_function_call.
  rpc CallFunction(CallFunctionRequest) returns (CallFunctionResponse);
  // v7: detached execution family — see RunDetachedRequest above.
  rpc RunDetached(RunDetachedRequest) returns (RunDetachedResponse);
  rpc DetachedStatus(DetachedHandleRequest) returns (DetachedStatusResponse);
  rpc DetachedTail(DetachedTailRequest) returns (DetachedTailResponse);
  rpc DetachedKill(DetachedHandleRequest) returns (OpStatus);
}

// ---------------------------------------------------------------- Registry ----
//
// User-mode wrapper over the standard Reg* API. Runs in the agent (SYSTEM
// context when the agent is a service; otherwise the agent's user token).
// hive = HKLM | HKCU | HKCR | HKU | HKCC.
// wow64_32 = true opens the 32-bit view (KEY_WOW64_32KEY); otherwise the
// native view is used.

// v5: impersonation of another user's hive (needs the PryAgent to run
// as SYSTEM or hold SeImpersonatePrivilege). Use "user_by_pid:<pid>" to
// pick up an interactively-logged user's token from any process they own,
// or "user_by_sid:<S-1-5-...>" to walk sessions for one matching the SID.
// Empty (default) = agent's own token (SYSTEM under the service).

message RegGetRequest {
  string hive = 1;
  string subkey = 2;
  string value = 3;
  bool wow64_32 = 4;
  string impersonate = 5;  // "" | "user_by_pid:<pid>" | "user_by_sid:<sid>"
}
message RegGetResponse {
  OpStatus status = 1;
  uint32 type = 2;       // REG_SZ=1, REG_EXPAND_SZ=2, REG_BINARY=3, REG_DWORD=4, REG_QWORD=11, REG_MULTI_SZ=7 ...
  bytes data = 3;        // raw bytes as returned by RegQueryValueExW
  string data_str = 4;   // decoded UTF-16LE for REG_SZ / REG_EXPAND_SZ / (first item of) REG_MULTI_SZ
  uint64 data_qword = 5; // decoded for REG_DWORD (32-bit widened) / REG_QWORD; else 0
  repeated string data_multi_sz = 6; // populated only for REG_MULTI_SZ
}
message RegSetRequest {
  string hive = 1;
  string subkey = 2;
  string value = 3;
  uint32 type = 4;
  bytes data = 5;
  bool wow64_32 = 6;
  bool create_subkey = 7; // RegCreateKeyEx vs RegOpenKeyEx
  string impersonate = 8;
}
message RegSetResponse { OpStatus status = 1; }
message RegEnumRequest {
  string hive = 1;
  string subkey = 2;
  bool wow64_32 = 3;
  bool want_subkeys = 4;
  bool want_values = 5;
  string impersonate = 6;
}
message RegValueMeta {
  string name = 1;
  uint32 type = 2;
  uint32 size = 3;
}
message RegEnumResponse {
  OpStatus status = 1;
  repeated string subkeys = 2;
  repeated RegValueMeta values = 3;
}
message RegDeleteRequest {
  string hive = 1;
  string subkey = 2;
  string value = 3;      // empty -> delete the subkey; non-empty -> delete just the value
  bool recursive = 4;    // subkey delete: recurse via SHDeleteKey semantics
  bool wow64_32 = 5;
  string impersonate = 6;
}
message RegDeleteResponse { OpStatus status = 1; }

service Registry {
  rpc Get(RegGetRequest) returns (RegGetResponse);
  rpc Set(RegSetRequest) returns (RegSetResponse);
  rpc Enum(RegEnumRequest) returns (RegEnumResponse);
  rpc Delete(RegDeleteRequest) returns (RegDeleteResponse);
}

// --------------------------------------------------------------- Watchdog ----
//
// v8: wedge → bugcheck watchdog. Arm registers an id + deadline; the driver's
// system thread KeBugCheckEx()'s when the deadline passes without a Kick. Use
// auto-kick from the orchestrator for continuous coverage during a session —
// any wedge in the LLM loop / harness turns into an analyzable dump instead
// of a silent hang. The four bug-check arguments (Id, DeadlineUs, LastKickUs,
// Cookie) make the dump self-identify as ours under `!analyze -v`.

message WdgArmRequest {
  uint32 id = 1;              // caller-chosen nonzero id
  uint32 deadline_ms = 2;     // 1..3_600_000
  uint32 bugcheck_code = 3;   // 0 = 0xE2 MANUALLY_INITIATED_CRASH
  uint32 flags = 4;           // 1 = replace existing entry with same id
  uint64 cookie = 5;          // opaque; echoed into the dump as arg4
  string label = 6;           // <= 31 chars; truncated server-side
}
message WdgArmResponse { OpStatus status = 1; }

message WdgKickRequest {
  uint32 id = 1;
  uint32 deadline_ms = 2;     // 0 = keep existing deadline; > 0 = reset to this
  uint64 cookie = 3;          // 0 = keep existing cookie
}
message WdgKickResponse {
  OpStatus status = 1;
  uint64 kick_count = 2;
  uint64 last_kick_us = 3;
  uint64 deadline_us = 4;     // absolute QPC-us after this kick
}

message WdgDisarmRequest { uint32 id = 1; }
message WdgListRequest {}

message WdgEntry {
  uint32 id = 1;
  uint32 bugcheck_code = 2;
  uint64 deadline_us = 3;     // absolute QPC-us
  uint64 last_kick_us = 4;
  uint64 kick_count = 5;
  uint64 cookie = 6;
  uint64 armed_us = 7;
  string label = 8;
  int64 remaining_ms = 9;     // signed; negative = overdue at read time
}
message WdgListResponse {
  OpStatus status = 1;
  repeated WdgEntry entries = 2;
  uint64 now_us = 3;          // driver's QPC-us at read time
}

service Watchdog {
  rpc Arm(WdgArmRequest) returns (WdgArmResponse);
  rpc Kick(WdgKickRequest) returns (WdgKickResponse);
  rpc Disarm(WdgDisarmRequest) returns (OpStatus);
  rpc List(WdgListRequest) returns (WdgListResponse);
}

// ============================================================================
// agent primitives round — hands (Device.Ioctl), eyes
// (Memory.ThreadList, Memory.ObjEnum), ears (Events stream), telemetry
// (Telemetry.Providers/Sessions). Device/Telemetry/ThreadList are
// usermode-only (no driver); ObjEnum and the Events feed are driver-backed.
// ============================================================================

// Device: send an arbitrary IOCTL to a device on the target. The agent runs
// as SYSTEM, so both DOS-style symlink paths and raw device-object paths
// are openable via NtCreateFile. SAFETY: this is an actuator — a bad IOCTL can
// bugcheck the target; the orchestrator gates it behind
// security.allow_ioctl_send (default false) and the destructive gate.
service Device {
  rpc Ioctl(DeviceIoctlRequest) returns (DeviceIoctlResponse);
}

message DeviceIoctlRequest {
  string device = 1;       // "\.\Name" symlink OR "\Device\Name" object path
  uint32 code = 2;         // CTL_CODE (must be >= 0x10000)
  bytes in_buffer = 3;     // input payload (may be empty)
  uint32 out_size = 4;     // output buffer size to allocate (agent caps it)
  uint32 timeout_ms = 5;   // 0 = agent default (10s)
}

message DeviceIoctlResponse {
  OpStatus status = 1;
  bytes out_buffer = 2;    // whatever the driver returned
  uint32 bytes_returned = 3;
  uint32 last_error = 4;   // Win32 error when the send itself failed
}

// Telemetry: read-only ETW inventory — "what telemetry exists / who is
// watching". Query only; starting trace sessions is out of scope (the
// Events feed covers the kernel-side notification need).
service Telemetry {
  rpc Providers(EtwProvidersRequest) returns (EtwProvidersResponse);
  rpc Sessions(EtwSessionsRequest) returns (EtwSessionsResponse);
}

message EtwProvidersRequest {
  string name_filter = 1;  // case-insensitive substring; empty = all
}
message EtwProviderInfo {
  string guid = 1;
  string name = 2;
}
message EtwProvidersResponse {
  OpStatus status = 1;
  repeated EtwProviderInfo providers = 2;
  uint32 count = 3;
  bool truncated = 4;
}
message EtwSessionsRequest {
  string name_filter = 1;
}
message EtwSessionInfo {
  string name = 1;         // logger session name
  uint64 logger_id = 2;
  uint32 buffers_written = 3;
  uint32 buffers_lost = 4;
  uint64 events_lost = 5;
  uint32 loggers = 6;      // providers attached (best effort)
}
message EtwSessionsResponse {
  OpStatus status = 1;
  repeated EtwSessionInfo sessions = 2;
  uint32 count = 3;
}

// Memory.ThreadList: per-thread inventory. Agent-side base path uses
// NtQuerySystemInformation(SystemProcessInformation) — works without the
// driver. The driver-side enrichment (ETHREAD Win32StartAddress etc.) rides
// the same RPC when the driver is up (kernel=true). (The Debug service's
// ThreadInfo covers attached-process threads; this is the system-wide view.)
message ThreadListRequest {
  uint32 pid = 1;          // 0 = every process
  bool kernel = 2;         // driver-backed walk when true (ABI v11 driver)
  // v14: capture a CONTEXT register frame per thread via
  // SuspendThread+GetThreadContext+ResumeThread — pure usermode, no driver,
  // no dbgeng attach (the "wedged process" snapshot path). Threads of the
  // agent itself are skipped.
  bool with_context = 3;
}
message SysThreadInfo {
  uint32 tid = 1;
  uint32 pid = 2;
  uint64 start_va = 3;     // thread start address (SystemThreadInformation)
  uint32 state = 4;        // KTHREAD_STATE
  uint32 wait_reason = 5;
  int32 base_priority = 6;
  uint64 win32_start_va = 7;   // driver-backed only; 0 when unavailable
  uint64 teb = 8;              // driver-backed only; 0 when unavailable
  // v14: populated only when with_context was set and the thread could be
  // opened+suspended (empty map otherwise). Keys are CONTEXT register
  // names (rip, rsp, rbp, rax..r15, eflags, segs).
  map<string, uint64> context_regs = 9;
}
message ThreadListResponse {
  OpStatus status = 1;
  repeated SysThreadInfo threads = 2;
  uint32 count = 3;
  bool truncated = 4;
  string source = 5;       // "agent" (NtQuerySystemInformation) | "driver"
}

// Memory.ObjEnum: kernel object-directory enumeration (\Device, \Driver,
// \FileSystem, \BaseNamedObjects, \Callback, \ObjectTypes). Driver-side uses
// ZwOpenDirectoryObject + ZwQueryDirectoryObject — version-proof, no struct
// offsets. Depth/entry caps are enforced driver-side.
message ObjEnumRequest {
  string path = 1;         // e.g. "\Device", "\Driver"; leading "\" required
  uint32 depth = 2;        // 1 = flat listing (cap 2)
  uint32 max_entries = 3;  // agent caps at 4096
}
message ObjEntry {
  string name = 1;
  string type = 2;         // object type name ("Device", "Driver", ...)
  // body VA + type index resolved by walking the
  // OBJECT_DIRECTORY hash buckets (``ObpRootDirectoryObject`` ->
  // OBJECT_HEADER). Both are 0 when the driver fell back to the
  // address-less ZwQueryDirectoryObject path.
  uint64 address    = 3;
  uint32 type_index = 4;
  string source     = 5;   // "walk" | "zwquery"
}
message ObjEnumResponse {
  OpStatus status = 1;
  repeated ObjEntry entries = 2;
  uint32 count = 3;
  bool truncated = 4;
}

// Events: target-initiated kernel notifications (the "ears"). The driver
// registers PsSet{CreateProcess,CreateThread,LoadImage}NotifyRoutine and
// rings events into a bounded buffer; the agent drains it and streams to the
// orchestrator. The orchestrator holds the stream (MCP clients cannot) and
// re-serves via event_manage poll.
//
// v12 (ABI v11): kernel HW-BP hit observability. EVENTS_KIND_BP_HIT
// rides the same ring; subscribing the class installs the driver's
// per-CPU int1 (IDT vector 1) hook — PatchGuard-sensitive, refused under
// HVCI, and gated by `dangerous_ok` on the request (maps to
// PRY_NOTIFY_FLAG_BP_HOOK_OK). Poll/Stream auto-subscribe the BP class
// when kinds_mask has bit (1<<6); hits surface on PryEvent
// address/dr6/bp_id/slot/access/irql fields.
service Events {
  rpc Stream(EventsStreamRequest) returns (stream EventsStreamChunk);
  rpc Poll(EventsPollRequest) returns (EventsPollResponse);
  rpc Stats(EventsStatsRequest) returns (EventsStatsResponse);
  rpc Disable(OpStatus) returns (OpStatus);   // v11: unregister notify callbacks
}
message PryEvent {
  OpStatus status = 1;
  uint64 seq = 2;          // monotonic per-boot driver sequence
  uint64 ts_ms = 3;        // unix ms of the event (driver-stamped; drain time if unstamped)
  EventsKind kind = 4;
  uint32 pid = 5;
  uint32 parent_pid = 6;
  uint32 tid = 7;
  string image = 8;        // image/driver path (UTF-8, best effort)
  string cmdline = 9;      // process-create only (may be empty)
  bool dropped = 10;       // true when the driver ring overwrote events
  // ---- v12 BP_HIT payload (zero for other kinds) ----
  uint64 address = 11;     // faulting RIP
  uint64 dr6 = 12;         // raw DR6 at trap entry
  uint32 bp_id = 13;       // matched pry bp id (0 = table lock skipped)
  uint32 slot = 14;        // DR slot 0-3 (0xFF = unresolved)
  uint32 access = 15;      // matched PRY_HW_* (0=exec 1=write 2=rw)
  uint32 irql = 16;        // KeGetCurrentIrql() at hit
}
// kept separate from the message so adding kinds stays wire-compatible
enum EventsKind {
  EVENTS_KIND_UNSPECIFIED = 0;
  EVENTS_PROC_CREATE = 1;
  EVENTS_PROC_EXIT = 2;
  EVENTS_IMAGE_LOAD = 3;
  EVENTS_THREAD_CREATE = 4;
  EVENTS_THREAD_EXIT = 5;
  EVENTS_KIND_BP_HIT = 6;  // v12: kernel HW-BP hit (int1 hook)
}
message EventsStreamRequest {
  uint32 kinds_mask = 1;   // bitmask of (1 << EventsKind); 0 = all.
                         // NOTE: bit 6 (BP_HIT) additionally installs the
                         // int1 hook — see dangerous_ok.
  uint32 interval_ms = 2;  // drain interval, default 250
  uint32 duration_s = 3;   // 0 = until client cancels
  uint32 max_events = 4;   // 0 = unlimited (bounded by duration)
  bool dangerous_ok = 5;   // v12: consent for the IDT[1] hook when the
                           // mask includes BP_HIT (PatchGuard-sensitive,
                           // lab-only). Without it the BP class is refused.
}
message EventsStreamChunk {
  OpStatus status = 1;
  repeated PryEvent events = 2;
  uint64 dropped = 3;      // driver-side overwrite-oldest counter (cumulative)
  bool done = 4;
}
message EventsPollRequest {
  uint64 since_seq = 1;    // 0 = from the oldest buffered event
  uint32 max_events = 2;   // driver caps the drain
  uint32 kinds_mask = 3;   // v12: bitmask of (1 << EventsKind); 0 = all.
                         // Bit 6 auto-subscribes the BP class first
                         // (installs the int1 hook — needs dangerous_ok).
  bool dangerous_ok = 4;   // v12: consent for the IDT[1] hook install
}
message EventsPollResponse {
  OpStatus status = 1;
  repeated PryEvent events = 2;
  uint64 last_seq = 3;
  uint64 dropped = 4;      // overwrite-oldest counter (events lost forever)
  bool subscribed = 5;     // whether any notify class is enabled
  bool bp_hook = 6;        // v12: int1 hook installed (BP class registered)
}
message EventsStatsRequest {}
message EventsStatsResponse {
  OpStatus status = 1;
  uint64 buffered = 2;
  uint64 dropped = 3;
  uint64 seq = 4;          // highest seq issued
  bool proc_notify = 5;    // which callback classes are registered
  bool image_notify = 6;
  bool thread_notify = 7;
  bool bp_hook = 8;        // v12: int1 hook installed (BP class registered)
  uint64 bp_missed = 9;    // v12: hits consumed without a ring record
                         // (lock contention / teardown window)
}

// ---------------------------------------------------------------- Cpu ----
// PR#6 T3.2: MSR / CPUID reader. Driver pins to the target core via
// KeSetSystemGroupAffinityThread, __readmsr / __cpuidex, catches #GP on
// unimplemented MSRs with __try/__except, and returns one row per
// core. Pure read surface — no actuator semantics.
message MsrReadRequest  {
  uint32 msr = 1;
  repeated uint32 cores = 2; // explicit set; ignored when all_cores=true
  bool all_cores = 3;        // walk every active logical processor
}
message MsrValue        {
  uint32 core = 1;
  uint64 value = 2;
  uint32 nt_status = 3;      // STATUS_SUCCESS on read; STATUS_UNSUCCESSFUL (0xC0000001)
                              // on #GP (unimplemented MSR). Non-SUCCESS rows carry
                              // value=0.
}
message MsrReadResponse {
  OpStatus status = 1;
  repeated MsrValue values = 2;
}

message CpuidRequest    {
  uint32 leaf = 1;
  uint32 subleaf = 2;
  repeated uint32 cores = 3;
  bool all_cores = 4;
}
message CpuidValue      {
  uint32 core = 1;
  uint32 eax = 2;
  uint32 ebx = 3;
  uint32 ecx = 4;
  uint32 edx = 5;
}
message CpuidResponse   {
  OpStatus status = 1;
  repeated CpuidValue values = 2;
}

service Cpu {
  rpc MsrRead(MsrReadRequest) returns (MsrReadResponse);
  rpc CpuidRead(CpuidRequest) returns (CpuidResponse);
}

// ---- SI #1 image coherency ----
// System Informer feature #1 port (imgcoherency). Pure umagent+agent
// surface — no new IOCTL, no ABI change. Scores how closely a loaded
// module's in-memory image matches its on-disk file, skipping bytes
// the exclusion bitmap flags (relocs, IAT thunks, LoadConfig overrides,
// CFG tables, ImageBase in the optional header). Monotonic field
// numbering starts at 1 inside each message; wire-level additions here
// are append-only. See an internal plan
// 04-umagent-orchestrator.md §Feature 1 for the request/response
// contract and classifier labels.
message ImageCoherencyRequest {
  uint32 pid = 1;              // target pid; 0 = umagent self
  uint64 module_base = 2;      // module base VA override (0 => resolve from module_name)
  string module_name = 3;      // basename or full path; "" + module_base != 0 OK
  enum Mode {
    QUICK  = 0;                // ~192 KiB sample across .text/.rdata/other exec
    NORMAL = 1;                // 40 MiB total cap, proportional per section
    FULL   = 2;                // every byte of SizeOfImage
  }
  Mode mode = 4;
  uint32 max_mismatch_ranges = 5;    // default 128 orchestrator-side; 0 => no cap
  bool include_mismatch_hex = 6;     // if false, in_memory_sample/on_disk_sample empty
}

message ImageCoherencyMismatch {
  uint32 rva = 1;              // image RVA of the mismatch start
  uint32 length = 2;           // byte length of the coalesced run
  bytes  in_memory_sample = 3; // truncated capture (<=64 B) when include_mismatch_hex
  bytes  on_disk_sample = 4;
  string section = 5;          // ".text", ".idata", ...; empty when outside sections
  string hint = 6;             // "iat_slot" | "reloc" | "section_hole" | "unreadable_chunk" | ""
}

message ImageCoherencyResponse {
  OpStatus status = 1;
  string module_basename = 2;
  string module_path_disk = 3;        // on-disk file read for the compare
  uint64 size_of_image = 4;
  uint64 bytes_compared = 5;
  uint64 bytes_mismatched = 6;
  float  coherency = 7;               // 1.0 - mismatched/compared
  string classification = 8;          // populated orchestrator-side; empty on raw agent response
  repeated ImageCoherencyMismatch ranges = 9;
  uint64 sections_total = 10;
  uint64 sections_skipped_relocatable = 11;
  bool truncated = 12;                // bytes_compared < full budget OR max_mismatch_ranges hit
  // Section layout echo — lets the orchestrator classifier label
  // mismatches without a second RPC. One entry per section in header
  // order; empty on error paths. (name, va, size).
  message SectionSpan {
    string name = 1;
    uint32 va = 2;
    uint32 size = 3;
    uint32 characteristics = 4;
  }
  repeated SectionSpan sections = 13;
  uint32 reloc_dir_rva = 14;          // DataDirectory[5] rva/size — for classifier reloc overlap
  uint32 reloc_dir_size = 15;
}

// Standalone service to keep this feature's wire surface append-only
// (R8 proto split comes after SI Wave 2 — until then every new SI
// feature keeps itself isolated from the long-stable Memory service).
// Both agent and umagent register this service; the orchestrator picks
// the view with the same ``name=`` kwarg every other mem_rw verb uses.
service ImageCoherency {
  rpc Score(ImageCoherencyRequest) returns (ImageCoherencyResponse);
}

// ---- SI #21 self-protection ----
// ObRegisterCallbacks pre-op strips rights off handles opened against a
// configured PID set by non-trusted callers (kernel/own-dispatcher/
// self-opens pass through). Config installs or tears down the callback,
// Status reports counters + whether the altitude install took. See
// driver/src/SelfProt.c and an internal plan
// 02-driver-enumeration.md feature 21.
message SelfProtConfigRequest {
  // 0 = disable, 1 = enable (install or re-install), 2 = refresh PID list
  // without touching the callback registration.
  uint32 enable = 1;
  uint32 flags = 2;                 // PRY_SELFPROT_FLAG_* mirror
  uint32 process_access_keep = 3;   // 0 = driver default
  uint32 thread_access_keep = 4;    // 0 = driver default
  repeated uint32 protected_pids = 5; // up to PRY_SELFPROT_MAX_PIDS (32)
  // Opaque cookie seeded by the driver on first install and surfaced in
  // ConfigResponse.disable_token. Required alongside flag bit1 to turn
  // the callback off from a non-protected caller.
  uint64 disable_token = 6;
}
message SelfProtConfigResponse {
  OpStatus status = 1;
  uint32 state = 2;                 // PRY_SELFPROT_STATE_* bitmask
  bool installed = 3;
  uint32 altitude = 4;              // 389100..389109 that stuck, 0 otherwise
  uint32 protected_pids = 5;        // echoed count after apply
  // Driver-seeded cookie — the operator keeps this to post an OFF later.
  // Printed to the kernel log on first install (SELFPROT: disable_token=...).
  uint64 disable_token = 6;
}

message SelfProtStatusRequest {}
message SelfProtStatusResponse {
  OpStatus status = 1;
  uint32 state = 2;
  bool installed = 3;
  uint32 altitude = 4;
  uint32 protected_pids = 5;
  uint32 flags = 6;
  uint32 process_access_keep = 7;
  uint32 thread_access_keep = 8;
  uint64 preop_hits = 9;            // every pre-op invocation
  uint64 stripped = 10;             // handles whose DesiredAccess was narrowed
  uint64 bypassed = 11;             // kernel-origin / self / own-pid allowed through
}

service SelfProt {
  rpc Config(SelfProtConfigRequest) returns (SelfProtConfigResponse);
  rpc Status(SelfProtStatusRequest) returns (SelfProtStatusResponse);
}

// ---- SI #8 signer ----
// System Informer feature #8 port — WinVerifyTrust-based signer /
// Authenticode column surfaced on top of mem_rw(action='modules') (and,
// in a later cycle, process_list). Pure umagent+agent surface, no new
// IOCTL. Driver-free: catalog + embedded Authenticode probing happens
// entirely in user space via wintrust.dll + crypt32.dll. See the slice
// plan at an internal plan
// 04-umagent-orchestrator.md §Feature 6 for the response contract and
// signing-level buckets ({"microsoft","windows","antimalware",
// "3rd_party","unsigned","unknown"}).
message VerifySignaturesRequest {
  repeated string paths = 1;   // absolute Win32 paths; "" entries skipped
  bool force_recheck = 2;      // bypass the LRU (invalidate on size/mtime)
}

message SignerRow {
  string path = 1;                 // echoed back for the join
  string signer = 2;               // leaf-cert subject CN
  string issuer = 3;               // leaf-cert issuer CN (classifier input)
  string signing_level = 4;        // "microsoft"|"windows"|"antimalware"|
                                   // "3rd_party"|"unsigned"|"unknown"
  bool   is_signed = 5;            // WinVerifyTrust returned ERROR_SUCCESS
  bool   catalog = 6;              // signature came from a system catalog
  uint64 cache_timestamp_100ns = 7;// when the cache slot was filled
  bool   cache_hit = 8;            // row answered from the LRU
  string error = 9;                // non-empty when the probe soft-failed
}

message VerifySignaturesResponse {
  OpStatus status = 1;
  repeated SignerRow rows = 2;
  uint32 cache_hits = 3;           // rows that bypassed WinVerifyTrust
  uint32 probed = 4;               // rows that ran a full probe
}

// Standalone service — follows the same pattern as ImageCoherency (SI
// #1) so the agent and umagent register side-by-side without touching
// the long-stable Memory service. Both views implement the same RPC;
// orchestrator picks the view with the usual `name=` kwarg.
service Signatures {
  rpc Verify(VerifySignaturesRequest) returns (VerifySignaturesResponse);
}

// ---- SI #25 HW-watch (ABI v14) ----
// Hardware-watchpoint-backed `mem_rw watch`. Thin RPC facade over the
// driver's PRY_FUNC_BP_HW_SET: the agent packs IS_WATCH / PREEMPT_OK
// into Flags, forwards SLOT_AUTO when the orchestrator passes 0xFF,
// and returns the WatchCookie the driver mirrors into every ringed
// BP_HIT event. The underlying DR arming works even under HVCI; only
// hit observability needs the int1 trap hook, so PING flag
// PRY_FLAG_WATCH_HVCI_FALLBACK tells the orchestrator to poll
// instead when the hook can't install. Append-only — new SI #25 fields
// never piggy-back on existing BpAddRequest/BpAddResponse to keep this
// slice's wire surface collision-free with parallel Wave-1 agents.
message WatchHwAddRequest {
  uint32 pid = 1;        // target pid; 0 refused (watches are per-pid)
  uint64 tid = 2;        // 0 arms every thread of pid (incl. future)
  uint64 address = 3;    // VA to watch
  uint32 size = 4;       // 1 | 2 | 4 | 8 (DR length encoding)
  string access = 5;     // "write" | "rw" ("exec" refused)
  uint32 slot = 6;       // 0..3, or 0xFF to let the driver pick
  bool preempt_ok = 7;   // evict oldest existing WATCH entry on busy
  string tag = 8;        // orchestrator-side label (echoed in events)
}
message WatchHwAddResponse {
  OpStatus status = 1;
  uint32 watch_cookie = 2;    // demux key — mirrors PRY_BP_REC.Id
  uint32 slot = 3;            // DR slot the driver actually armed
  uint32 threads_patched = 4;
  bool hvci_fallback = 5;     // PRY_FLAG_WATCH_HVCI_FALLBACK snapshot
}
message WatchHwRemoveRequest {
  uint32 watch_cookie = 1;    // from WatchHwAddResponse
}

service WatchHw {
  rpc Add(WatchHwAddRequest) returns (WatchHwAddResponse);
  rpc Remove(WatchHwRemoveRequest) returns (OpStatus);
}

// ---- SI #14 process-snapshot dump ----
// System Informer feature #14 port — PssCaptureSnapshot +
// MiniDumpWriteDump with a stepped access-mask ladder
// (PROCESS_ALL_ACCESS -> VM_READ|QUERY_INFORMATION|DUP_HANDLE ->
// VM_READ|QUERY_INFORMATION -> QUERY_LIMITED_INFORMATION). Pure
// umagent+agent surface, no new IOCTL, no ABI change. The agent view
// is driver-free for non-PP targets; PP (Protected Process / PPL) is
// EXPLICITLY DEFERRED to feature #23 (Wave 3) and surfaces a clean
// ``pp_target_requires_feature_23`` error until that primitive lands.
// See the slice plan at an internal plan
// 04-umagent-orchestrator.md §Feature 9 (feature numbering: §9 ==
// README #14).
message ProcessDumpRequest {
  uint32 pid = 1;              // target pid; 0 and self refused
  uint64 flags = 2;            // MINIDUMP_TYPE bitmask; 0 => default
                               // (FullMemory | ThreadInfo | HandleData |
                               //  UnloadedModules | FullMemoryInfo |
                               //  TokenInformation)
  string output_path = 3;      // absolute Win32 path; "" => auto under
                               // %TEMP%\pry\dumps\pid_<pid>_<ms>.dmp
  bool use_snapshot = 4;       // true (default) runs the PSS path; false
                               // runs MiniDumpWriteDump directly on the
                               // open process handle
}

message ProcessDumpResponse {
  OpStatus status = 1;
  string path = 2;             // absolute path to the written dump
  uint64 size = 3;             // bytes
  string sha256 = 4;           // lowercase hex digest of the dump bytes
  uint32 access_mask_used = 5; // which rung of the ladder succeeded
  bool   snapshot_used = 6;    // echo of the PSS path indicator
  string kind = 7;             // populated on failure only: "bad_arg" |
                               // "self_pid" | "no_process" |
                               // "pp_target_requires_feature_23" |
                               // "access_denied" | "snapshot_failed" |
                               // "dump_failed" | "io_failed"
}

// Standalone service — same pattern as ImageCoherency (SI #1) and
// Signatures (SI #8): both agent and umagent register this service, the
// orchestrator picks the view with the usual ``name=`` kwarg. Keeps the
// long-stable Memory service untouched (R8 proto split follows SI
// Wave 2).
service ProcessDump {
  rpc CreateDump(ProcessDumpRequest) returns (ProcessDumpResponse);
  // NtSystemDebugControl(SysDbgGetLiveKernelDump)
  // path. Umagent-only (agent-side returns kind='not_supported' with hint
  // 'use name=user'). Gated by security.allow_live_kernel_dump.
  rpc CreateLiveKernelDump(CreateLiveKernelDumpRequest) returns (CreateLiveKernelDumpResponse);
}

// ---- live kernel dump ----
message CreateLiveKernelDumpRequest {
  string output_path = 1;       // "" => %SystemRoot%\LiveKernelDumps\pry_<ms>.dmp
  repeated string flags = 2;    // "hypervisor_pages" | "usermode" | "stack_only"
                                // | "compression" | "page_table_only"
  bool compression = 3;         // convenience bit for SYSDBG_LIVEDUMP_FLAG_COMPRESS_MEMORY_PAGES_DATA
  bool allow_cancel = 4;        // register a cancel event with SysDbg
}
message CreateLiveKernelDumpResponse {
  OpStatus status = 1;
  string path = 2;              // absolute path to the written dump
  uint64 size = 3;              // bytes
  string sha256 = 4;            // lowercase hex of the dump bytes
  uint32 flags_used_mask = 5;   // SYSDBG_LIVEDUMP_FLAG_* actually applied
  repeated string flags_unknown = 6; // flags we didn't recognize
  string kind = 7;              // "" on success; "not_allowed" | "access_denied"
                                // | "not_supported" | "io_failed" | "sysdbg_failed"
                                // on failure
  string error_detail = 8;      // free-form, usually win32-err / NTSTATUS hex
}

// ---- SI #10 ETW ----
// Private kernel ETW session: StartTrace + EnableTraceEx2 up front, a
// dedicated ProcessTrace worker consumes events into a bounded SPSC
// ring, orchestrator drains in bulk via Tail / Events. TDH decoding
// happens on the C++ side so Python never sees the GIL pressure a
// per-event decoder would create. The service lands on both the agent
// and the umagent — ETW is driver-free, so the surface is identical.
// Append-only: nothing in SI #10 reinterprets a previous field. See
// an internal plan
// §Feature 8.
message EtwStartRequest {
  string session_name = 1;       // ETW logger name; must be unique
  repeated string providers = 2; // names from etw_registry or GUIDs
  uint64 keywords_any = 3;       // MATCH_ANY_KEYWORD (0 = provider default)
  uint64 keywords_all = 4;       // MATCH_ALL_KEYWORD
  uint32 level = 5;              // TRACE_LEVEL_* (0 defaults to VERBOSE)
  uint32 buffer_size_kb = 6;     // per-buffer size (0 = ETW default)
  uint32 min_buffers = 7;        // 0 = ETW default
  uint32 max_buffers = 8;        // 0 = ETW default
  uint32 ring_capacity = 9;      // SPSC ring rows (0 = 16384)
}
message EtwStartResponse {
  OpStatus status = 1;
  string session_name = 2;
  uint64 session_handle = 3;        // opaque; informational only
  repeated string started_providers = 4;
  repeated string failed_providers = 5;
  uint32 ring_capacity = 6;         // actual (power-of-2) capacity
}

message EtwStopRequest { string session_name = 1; }
message EtwStopResponse {
  OpStatus status = 1;
  uint64 events_total = 2;
  uint64 events_dropped = 3;
}

// SI #10 uses dedicated row/request/response names (``EtwTrace*``) so
// they don't collide with the pre-existing Telemetry service's
// EtwSessionsRequest / EtwSessionsResponse (which answer QueryAllTraces
// for every logger on the box).
message EtwTraceSessionRow {
  string session_name = 1;
  uint64 events_total = 2;
  uint64 events_dropped = 3;
  uint32 providers = 4;
  bool running = 5;
}
message EtwTraceSessionsRequest {}
message EtwTraceSessionsResponse {
  OpStatus status = 1;
  repeated EtwTraceSessionRow sessions = 2;
}

message EtwEventRow {
  uint64 seq = 1;
  uint64 ts_100ns = 2;             // 100 ns since 1601 (ETW native)
  string provider_guid = 3;
  uint32 event_id = 4;
  uint32 pid = 5;
  uint32 tid = 6;
  uint32 opcode = 7;
  uint32 version = 8;
  uint32 level = 9;
  uint64 keywords = 10;
  string kind = 11;                 // etw_registry name (image/proc/...)
  map<string, string> fields = 12;  // TDH-decoded property blob
}

message EtwTailRequest {
  string session_name = 1;
  uint64 since_seq = 2;
  uint32 limit = 3;                 // 0 = up to ring_capacity
}
message EtwTailResponse {
  OpStatus status = 1;
  repeated EtwEventRow events = 2;
  uint64 last_seq = 3;
  uint64 dropped = 4;
}

message EtwEventsRequest {
  string session_name = 1;
  uint32 max_events = 2;            // bounded pull from the ring tail
  uint32 timeout_ms = 3;            // 0 = non-blocking
}
message EtwEventsResponse {
  OpStatus status = 1;
  repeated EtwEventRow events = 2;
  uint64 last_seq = 3;
  uint64 dropped = 4;
}

message EtwStatsRequest { string session_name = 1; }
message EtwStatsResponse {
  OpStatus status = 1;
  string session_name = 2;
  uint64 events_total = 3;
  uint64 events_dropped = 4;        // overwrite-oldest ring overflows
  uint64 events_lost = 5;           // EventsLost from ETW (buffer loss)
  uint64 buffers_written = 6;
  uint64 buffers_lost = 7;
  uint32 ring_capacity = 8;
  uint32 ring_used = 9;
  bool running = 10;
}

// Standalone service — ETW is driver-free, so the agent and umagent
// register side-by-side like Signatures / ImageCoherency. The
// orchestrator picks the view with the usual `name=` kwarg.
service EtwTrace {
  rpc Start(EtwStartRequest) returns (EtwStartResponse);
  rpc Stop(EtwStopRequest) returns (EtwStopResponse);
  rpc Sessions(EtwTraceSessionsRequest) returns (EtwTraceSessionsResponse);
  rpc Tail(EtwTailRequest) returns (EtwTailResponse);
  rpc Events(EtwEventsRequest) returns (EtwEventsResponse);
  rpc Stats(EtwStatsRequest) returns (EtwStatsResponse);
}

// ---- SI #6 handle ops ----
// Handle manipulation primitives built on top of PryHandleList — the
// agent forwards each verb to the matching driver IOCTL
// (PRY_IOCTL_HANDLE_DUP / _CLOSE_REMOTE / _COMPARE). See
// comm/abi/proc.h for the raw request/response contracts and
// an internal plan Feature 2
// for the kernel pattern (KernelMode PreviousMode on documented Ob*
// APIs, lab-tool contract). Standalone service — stays off the Memory
// surface so the Wave 1 split doesn't touch its long-stable shape.
message HandleDupRequest {
  uint64 src_pid = 1;          // source process holding the handle
  uint64 src_handle = 2;       // handle value inside src_pid's table
  uint32 desired_access = 3;   // granted to the duplicated handle
  uint32 options = 4;          // PRY_HANDLE_DUP_FLAG_*
  uint64 privilege_cookie = 5; // #24 session-token slot (opaque)
}
message HandleDupResponse {
  OpStatus status = 1;
  uint64 new_handle = 2;       // handle VA in CALLER's process table
  uint64 object_addr = 3;      // kernel pointer identity for the object
  uint32 granted_access = 4;
  uint32 type_index = 5;
  string type_name = 6;        // ObGetObjectType->TypeName best-effort
}

message HandleCloseRemoteRequest {
  uint64 target_pid = 1;
  uint64 target_handle = 2;
  uint64 privilege_cookie = 3;
}
message HandleCloseRemoteResponse {
  OpStatus status = 1;
}

message HandleCompareRequest {
  uint64 pid_a = 1;
  uint64 handle_a = 2;
  uint64 pid_b = 3;
  uint64 handle_b = 4;
  uint64 privilege_cookie = 5;
}
message HandleCompareResponse {
  OpStatus status = 1;
  bool same = 2;               // pointer identity after Ob dereference
  uint64 object_a = 3;
  uint64 object_b = 4;
  uint32 type_index_a = 5;
  uint32 type_index_b = 6;
}

service HandleOps {
  rpc Duplicate(HandleDupRequest) returns (HandleDupResponse);
  rpc CloseRemote(HandleCloseRemoteRequest) returns (HandleCloseRemoteResponse);
  rpc Compare(HandleCompareRequest) returns (HandleCompareResponse);
}

// ---- SI #9 kernel-stack walk ----
// Thread stack walk via RtlWalkFrameChain, delivered through a kernel-mode
// APC on the target thread (PryRemoteCall + PRY_RC_FLAG_KERNEL). The
// orchestrator correlates ModuleBase against the existing MODULES listing
// to resolve names in user space — the kernel verb stays pure. Default
// timeout bounded at 500 ms (plan README §6 — sequential IOCTL queue).
message StackWalkRequest {
  uint64 tid = 1;              // target thread (!=0)
  uint32 max_frames = 2;       // 0 defaults, clamped to PRY_STACKWALK_MAX_FRAMES
  uint32 flags = 3;            // PRY_STACKWALK_FLAG_*
  uint32 timeout_ms = 4;       // 0 => PRY_STACKWALK_DEFAULT_TIMEOUT_MS
  uint64 privilege_cookie = 5;
}

message StackWalkFrame {
  uint64 rip = 1;
  uint32 module_tag = 2;       // PRY_STACKWALK_MOD_* (0=kernel,1=user,2=unknown)
  uint64 module_base = 3;
}

message StackWalkResponse {
  OpStatus status = 1;
  uint32 pid = 2;
  uint32 flags = 3;            // PRY_STACKWALK_HDR_*
  uint64 rip = 4;              // snapshot RIP at APC entry
  uint64 rsp = 5;
  repeated StackWalkFrame kernel_frames = 6;
  repeated StackWalkFrame user_frames = 7;
}

service StackWalk {
  rpc Walk(StackWalkRequest) returns (StackWalkResponse);
}

// ---- SI #2 hidden-process ----
// System Informer feature #2 port — hidden-process detection by
// cross-referencing NtQuerySystemInformation(SystemProcessInformation)
// with alternative PID oracles. Wave 1 ships three usermode scanners
// (brute PID range via OpenProcess; registry PerfProc image/pid walk;
// ETW provider ownership via EnumerateTraceGuidsEx). CSRSS handle-table
// mode lands in Wave 2 behind the slice-1 HANDLE_LIST enrichment.
// Driver-free: both the agent and umagent register this service; the
// orchestrator picks the view with the usual `name=` kwarg. See
// an internal plan
// §Feature 2 for the response contract and verdict logic.
message HiddenProcessRequest {
  uint32 pid_max = 1;        // brute cap (0 => scanner default)
  uint32 step = 2;           // brute PID step (0 => 4)
  repeated string modes = 3; // "brute" | "registry" | "etw"; empty => all
  uint32 timeout_ms = 4;     // per-mode soft cap; 0 => scanner default
}

message HiddenPidRow {
  uint32 pid = 1;
  string image = 2;                  // best-effort image basename
  bool present_brute = 3;            // OpenProcess surfaced the PID
  bool present_registry = 4;         // PerfProc / service enum surfaced it
  bool present_etw = 5;              // EnumerateTraceGuidsEx owner PID
  uint64 exit_time_100ns = 6;        // non-zero => zombie (handle open w/ ExitTime)
  uint32 handle_count = 7;           // from GetProcessHandleCount (0 if denied)
  string sources = 8;                // comma-sep: "brute,etw"
}

message HiddenProcessResponse {
  OpStatus status = 1;
  repeated HiddenPidRow rows = 2;
  repeated string modes_run = 3;     // modes the scanner actually completed
  repeated string modes_failed = 4;  // modes that failed; row.present_* stays false
  uint32 pid_max_used = 5;           // the effective brute cap after clamping
  uint32 step_used = 6;              // effective step after clamping
}

// Standalone service — follows the same pattern as ImageCoherency and
// Signatures (SI #1/#8) so this slice's wire surface stays append-only
// and the long-stable Memory service is untouched. The orchestrator
// cross-joins these rows with mem_processes() (NtQSI ground truth) to
// compute per-candidate verdict labels.
service HiddenProcess {
  rpc Scan(HiddenProcessRequest) returns (HiddenProcessResponse);
}


// ============================================================================
// Five new standalone services (Token, Mitigations,
// Network, Services, ThreadInspect). All appended to the monolithic proto
// per the R8-deferred convention; each service is tagged with the eventual
// split destination so a mechanical R8 pass can lift them out without
// renumbering fields.
// ============================================================================


// ---------------------------------------------------------- SI slice 01 ----
// Token / privilege / SID viewer + mutator.
// R8-split: moves to proto/pry/token.proto
//
// Phase 0 skeleton — every RPC is declared with its full request/response
// shape per an internal plan Feature 1.
// Agent-side and umagent-side services both return grpc::Status::UNIMPLEMENTED
// until the P2 identity-policy slice fills them in.

message TokenCore {
  string user_sid = 1;
  string user_name = 2;
  string user_domain = 3;
  string logon_sid = 4;
  uint32 integrity_rid = 5;
  string integrity_name = 6;    // "untrusted"|"low"|"medium"|...|"system"|"protected"
  string elevation_type = 7;    // "default"|"full"|"limited"
  bool is_elevated = 8;
  bool linked_token_present = 9;
  bool uac_virtualization_enabled = 10;
  bool uac_virtualization_allowed = 11;
  uint32 mandatory_policy = 12;
  uint32 session_id = 13;
  uint32 logon_id_low = 14;
  uint32 logon_id_high = 15;
  bool is_app_container = 16;
  string app_container_sid = 17;
  string app_container_name = 18;
  uint32 app_container_number = 19;
  string trust_label_sid = 20;
  string trust_label_name = 21;
}

message TokenGroup {
  string sid = 1;
  string name = 2;
  string domain = 3;
  uint32 attributes = 4;
  bool is_deny = 5;
  bool is_mandatory = 6;
  bool is_integrity = 7;
  bool is_logon_id = 8;
  bool is_enabled = 9;
  bool is_enabled_by_default = 10;
  bool is_use_for_deny_only = 11;
  bool is_owner = 12;
  bool is_resource = 13;
  string use = 14;              // SID_NAME_USE string ("User"|"Group"|...)
}

message TokenPrivilege {
  uint32 luid_low = 1;
  uint32 luid_high = 2;
  string name = 3;
  string display_name = 4;
  uint32 attributes = 5;
  string state = 6;             // "enabled"|"disabled"|"default"
  bool enabled_by_default = 7;
}

message TokenCapability {
  string sid = 1;
  string name = 2;
}

message LogonSessionInfo {
  uint32 logon_id_low = 1;
  uint32 logon_id_high = 2;
  string user_name = 3;
  string auth_domain = 4;
  uint32 logon_type = 5;
  string logon_type_name = 6;
  uint32 session_id = 7;
  uint64 logon_time_100ns = 8;
  uint64 logoff_time_100ns = 9;
  string logon_server = 10;
  string dns_domain_name = 11;
  string upn = 12;
  uint32 user_flags = 13;
}

message TokenViewRequest {
  uint32 pid = 1;
  uint32 tid = 2;               // 0 => primary
  bool include_groups = 3;
  bool include_privileges = 4;
  bool include_security_attributes = 5;
  bool include_logon_session = 6;
}
message TokenViewResponse {
  OpStatus status = 1;
  TokenCore core = 2;
  repeated TokenGroup groups = 3;
  repeated TokenPrivilege privileges = 4;
  repeated TokenCapability capabilities = 5;
  bytes security_attributes_raw = 6;
  LogonSessionInfo logon_session = 7;
  string token_source = 8;      // "primary" | "impersonation"
  bool thread_impersonating = 9;
}

message AdjustPrivilegeRequest {
  uint32 pid = 1;
  uint32 tid = 2;
  string privilege_name = 3;
  uint32 luid_low = 4;
  uint32 luid_high = 5;
  string action = 6;            // "enable" | "disable" | "remove"
}
message AdjustPrivilegeResponse {
  OpStatus status = 1;
  string previous_state = 2;
  string new_state = 3;
  uint32 luid_low = 4;
  uint32 luid_high = 5;
}

message SetIntegrityLevelRequest {
  uint32 pid = 1;
  uint32 tid = 2;
  uint32 integrity_rid = 3;
  string integrity_name = 4;    // overrides integrity_rid when non-empty
}
message SetIntegrityLevelResponse {
  OpStatus status = 1;
  uint32 previous_rid = 2;
  uint32 new_rid = 3;
}

message SetVirtualizationRequest {
  uint32 pid = 1;
  uint32 tid = 2;
  bool enable = 3;
}
message SetVirtualizationResponse {
  OpStatus status = 1;
  bool previous = 2;
  bool new_value = 3;
}

message ImpersonateRequest {
  uint32 source_pid = 1;
  uint32 source_tid = 2;
  bool persist = 3;             // false => tombstone at 30s; true => 300s
  uint32 target_tid = 4;        // 0 => dedicated agent worker thread
  string impersonation_level = 5; // "anonymous"|"identification"|"impersonation"|"delegation"
}
message ImpersonateResponse {
  OpStatus status = 1;
  string impersonation_id = 2;
  uint32 agent_thread_id = 3;
  string level_granted = 4;
}

message StopImpersonateRequest {
  string impersonation_id = 1;
}

message DaclAce {
  string sid = 1;
  uint32 access_mask = 2;
  string type = 3;              // "allow" | "deny"
  uint32 flags = 4;
}
message ModifyDefaultDaclRequest {
  uint32 pid = 1;
  uint32 tid = 2;
  repeated DaclAce aces = 3;
  bool replace = 4;             // false => merge, true => wipe-and-set
}
message ModifyDefaultDaclResponse {
  OpStatus status = 1;
  uint32 ace_count_before = 2;
  uint32 ace_count_after = 3;
}

message LookupRow {
  string input = 1;             // original SID or name
  string sid = 2;
  string name = 3;
  string domain = 4;
  string use = 5;               // SID_NAME_USE string
  bool well_known = 6;
}
message LookupSidRequest {
  repeated string sids = 1;
  repeated string names = 2;
}
message LookupSidResponse {
  OpStatus status = 1;
  repeated LookupRow rows = 2;
}

message LogonSessionsRequest {
  bool include_dns_names = 1;
}
message LogonSessionsResponse {
  OpStatus status = 1;
  repeated LogonSessionInfo sessions = 2;
}

service Token {
  rpc View(TokenViewRequest) returns (TokenViewResponse);
  rpc AdjustPrivilege(AdjustPrivilegeRequest) returns (AdjustPrivilegeResponse);
  rpc SetIntegrityLevel(SetIntegrityLevelRequest) returns (SetIntegrityLevelResponse);
  rpc SetVirtualization(SetVirtualizationRequest) returns (SetVirtualizationResponse);
  rpc Impersonate(ImpersonateRequest) returns (ImpersonateResponse);
  rpc StopImpersonate(StopImpersonateRequest) returns (OpStatus);
  rpc ModifyDefaultDacl(ModifyDefaultDaclRequest) returns (ModifyDefaultDaclResponse);
  rpc LookupSid(LookupSidRequest) returns (LookupSidResponse);
  rpc LogonSessions(LogonSessionsRequest) returns (LogonSessionsResponse);
}


